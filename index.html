<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0e">
<title>Trainingslog</title>
<style>
:root{--bg:#0c0c0e;--s1:#18181b;--s2:#27272a;--s3:#3f3f46;--tx:#f4f4f5;--mut:#71717a;--dim:#52525b;--red:#dc2626;--red2:#ef4444;--grn:#34d399;--grn2:#10b981;--amb:#f59e0b;--sky:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif;font-size:15px;padding-bottom:74px;min-height:100vh}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--s2);padding:16px 16px 10px;z-index:10}
header h1{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;display:inline}
#hinfo{float:right;font-size:11px;color:var(--mut)}
main{padding:16px;display:flex;flex-direction:column;gap:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s1);border-top:1px solid var(--s2);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:13px 0;background:none;border:none;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
nav button.on{color:var(--red2);border-top:2px solid var(--red2);margin-top:-1px}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:14px;padding:14px}
.card.hl{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.45)}
.card.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.4)}
.card.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.35)}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:800;font-size:14px}
.btn.red{background:var(--red);color:#fff}.btn.dim{background:var(--s2);color:var(--mut)}.btn.grn{background:var(--grn2);color:#fff}.btn.amb{background:var(--amb);color:#111}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.small{font-size:12px;color:var(--mut)}.tiny{font-size:11px;color:var(--dim)}
.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.chip{padding:6px 10px;border-radius:8px;border:none;background:var(--s2);color:var(--mut);font-size:12px;font-weight:700}
.chip.on-g{background:var(--grn2);color:#fff}.chip.on-n{background:var(--s3);color:#fff}.chip.on-r{background:var(--red);color:#fff}.chip.on-a{background:var(--amb);color:#111}
input[type=text],textarea,select{background:var(--s2);border:1px solid var(--s3);border-radius:9px;color:var(--tx);padding:9px 10px;font-size:14px;width:100%;font-family:inherit;-webkit-appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--red2)}
.win{width:100%;text-align:center;font-size:17px;padding:11px 6px}.winr{width:100%;text-align:center;font-size:17px;padding:11px 6px}
.setrow{display:flex;flex-direction:column;gap:5px;background:rgba(63,63,70,.22);border-radius:10px;padding:7px 8px}
.rir{width:33px;height:33px;border-radius:8px;border:none;background:var(--s2);color:var(--dim);font-weight:800;font-size:12px}
.rir.g{background:var(--grn);color:#052}.rir.y{background:var(--amb);color:#210}.rir.r{background:var(--red);color:#fff}.rir.d{background:var(--s3);color:#fff}
.exname{font-weight:700;font-size:14px}
.rec{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--grn);border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0}
.note-a{color:rgba(245,158,11,.85);font-size:12px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.hrow{display:flex;justify-content:space-between;padding:10px 0 4px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat3 .card{text-align:center;padding:12px 6px}
.stat3 b{font-size:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--s1);border-top:1px solid var(--s3);border-radius:18px 18px 0 0;padding:16px;max-height:70vh;overflow-y:auto}
.libitem{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--s3);border-radius:9px;padding:10px;margin-top:6px;color:var(--tx);font-size:13px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--grn2);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.swap{color:var(--sky);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);border-radius:7px;padding:3px 9px;font-size:13px;font-weight:800}
svg text{font-family:ui-monospace,Menlo,monospace}
input[type=range]{width:100%;accent-color:var(--red2)}
.hline{border-bottom:1px solid var(--s2);padding:5px 0;display:flex;justify-content:space-between;font-size:12px}
.hline:last-child{border:none}
h2{font-size:20px;font-weight:900;letter-spacing:-.02em}
.del{color:var(--red2);background:var(--s2);border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700}
.del.sure{background:var(--red);color:#fff}
</style>
</head>

const activePlan=()=>state.plans.find(p=>p.id===state.settings.activePlanId)||state.plans[0];
const weeks=()=>Math.floor((Date.now()-new Date(state.settings.cycleStart).getTime())/6048e5);
const DELOAD_AFTER=21; // Einheiten pro Zyklus (~6 Wochen bei jedem 2. Tag)
const sessionsSinceCycle=()=>state.logs.filter(l=>!l.deload&&l.date>=state.settings.cycleStart).length;
const deloadDue=()=>sessionsSinceCycle()>=DELOAD_AFTER;
function daysSinceLast(){const l=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date));if(!l.length)return 0;
  return Math.floor((Date.now()-new Date(l[l.length-1].date).getTime())/864e5)}
function lastByEx(){const m={};[...state.logs].filter(l=>!l.deload).sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>l.entries.forEach(e=>{if(e.sets.some(s=>s.w>0&&s.r>0))m[e.exerciseId]={sets:e.sets}}));return m}
// Rückschritt erkennen: letzte Einheit schwächer als die davor (Tagesform)
function prevBetter(exId){
  const ws=state.logs.filter(l=>!l.deload).sort((a,b)=>a.date.localeCompare(b.date))
    .map(l=>{const e=l.entries.find(x=>x.exerciseId===exId);if(!e)return null;
      const w=Math.max(...e.sets.map(s=>+s.w||0));return w>0?w:null}).filter(Boolean);
  if(ws.length<2)return null;
  const last=ws[ws.length-1],prev=ws[ws.length-2];
  return last<prev?{last,prev}:null;
}
function performanceDrop(){
  const ls=state.logs.filter(l=>!l.deload).sort((a,b)=>a.date.localeCompare(b.date)).slice(-4);
  if(ls.length<3)return 0;
  const byEx={};
  ls.forEach((l,i)=>l.entries.forEach(e=>{if(!MUSCLE_GROUPS[e.exerciseId])return;
    const b=e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0);if(b>0)(byEx[e.exerciseId]=byEx[e.exerciseId]||[]).push(b)}));
  let drop=0,tot=0;
  Object.values(byEx).forEach(v=>{if(v.length<2)return;tot++;if(v[v.length-1]<Math.max(...v.slice(0,-1))*0.97)drop++});
  return tot>=4&&drop/tot>=0.5?drop:0;
}
// Abwesenheiten
const absSoon=()=>{const a=(state.settings.absences||[]).map(x=>x).sort((p,q)=>p.from.localeCompare(q.from));
  const t=todayISO();return a.find(x=>x.to>=t&&(new Date(x.from)-new Date(t))/864e5<=10)||null};
const inAbsence=()=>{const t=todayISO();return (state.settings.absences||[]).find(x=>x.from<=t&&x.to>=t)||null};
function stagnationFor(exId){
  const pts=state.logs.filter(l=>!l.deload).sort((a,b)=>a.date.localeCompare(b.date))
    .map(l=>{const e=l.entries.find(x=>x.exerciseId===exId);if(!e)return null;
      const b=e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0);return b>0?{v:b,date:l.date,rir:e.sets.map(s=>s.rir)}:null}).filter(Boolean);
  if(pts.length<3)return null;
  const last3=pts.slice(-3);const best=Math.max(...pts.slice(0,-3).map(p=>p.v),last3[0].v);
  const noGain=last3.every(p=>p.v<=best*1.005);
  if(!noGain)return null;
  const n=pts.length-pts.findIndex(p=>p.v>=best*0.995);
  const allOut=last3.every(p=>p.rir.some(r=>r===0));
  if(pts.length>=5&&last3.every((p,i)=>i===0||p.v<=last3[i-1].v*1.001)&&allOut)
    return{lvl:2,txt:"Stagnation über "+last3.length+" Einheiten trotz RIR0 → Übungs-Deload empfohlen: −10% für 1 Einheit, dann neu aufbauen",w:null};
  return{lvl:1,txt:"Kein Zuwachs über "+last3.length+" Einheiten → Gewicht halten, Wdh im Zielbereich ausreizen (Technik/Tempo sauber)",w:null};
}
function recommendFor(entry){
  if(/prehab/i.test(entry.scheme||""))return null;
  const last=lastByEx()[entry.exerciseId];if(!last)return null;
  const ls=last.sets.filter(s=>s.r>0);if(!ls.length)return null;
  const m=(entry.reps||"").match(/(\d+)\s*-\s*(\d+)/);if(!m)return null;
  const lo=+m[1],hi=+m[2];const s1=ls[0];const w=+s1.w||0;if(!w)return null;
  if(s1.r>=hi&&(s1.rir==null||s1.rir>=1))return{w:roundPlate(w+2.5),txt:"+2,5kg — Zielbereich oben erreicht ("+w+"×"+s1.r+")"};
  if(ls.every(s=>s.r<lo&&s.rir===0))return{w:roundPlate(Math.max(w-2.5,0)),txt:"−2,5kg — unter Zielbereich trotz RIR0"};
  return null;
}

// Automatische Bereinigung: gleiche Namen zusammenführen, Karteileichen entfernen
function migrateDupes(){
  let changed=false;
  const count=id=>state.logs.reduce((a,l)=>a+l.entries.filter(e=>e.exerciseId===id).length,0);
  const byName={};
  state.library.forEach(e=>{const k=e.name.trim().toLowerCase();(byName[k]=byName[k]||[]).push(e)});
  Object.values(byName).forEach(group=>{
    if(group.length<2)return;
    const keep=group.slice().sort((a,b)=>count(b.id)-count(a.id))[0];
    group.filter(e=>e.id!==keep.id).forEach(dup=>{
      state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===dup.id){e.exerciseId=keep.id;e.name=keep.name}}));
      state.plans.forEach(p=>p.sessions.forEach(s=>{
        s.exercises.forEach(ex=>{if(ex.id===dup.id){ex.id=keep.id;ex.name=keep.name}});
        const seen=new Set();s.exercises=s.exercises.filter(ex=>seen.has(ex.id)?false:(seen.add(ex.id),true));}));
      state.library=state.library.filter(e=>e.id!==dup.id);changed=true;
    });
  });
  // Karteileichen: keine Logs, in keinem Plan
  const used=new Set(state.plans.flatMap(p=>p.sessions.flatMap(s=>s.exercises.map(e=>e.id))));
  const before=state.library.length;
  state.library=state.library.filter(e=>used.has(e.id)||count(e.id)>0);
  if(state.library.length!==before)changed=true;
  if(changed){saveJ("logs",state.logs);saveJ("plans",state.plans);saveJ("library",state.library)}
  return changed;
}

function doRename(id){
  const inp=$("rn-"+id);const n=(inp?inp.value:"").trim();
  if(!n){toast("Name darf nicht leer sein");return}
  if(state.library.some(e=>e.id!==id&&e.name.trim().toLowerCase()===n.toLowerCase())){toast("Name existiert bereits — stattdessen zusammenführen (⇄)");return}
  const lib=state.library.find(e=>e.id===id);if(lib)lib.name=n;
  state.plans.forEach(p=>p.sessions.forEach(s=>s.exercises.forEach(ex=>{if(ex.id===id)ex.name=n})));
  state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===id)e.name=n}));
  saveJ("library",state.library);saveJ("plans",state.plans);saveJ("logs",state.logs);
  state.renameId=null;render();toast("Umbenannt — alle Daten erhalten ✓")}
function doMerge(toId){
  const from=state.mergeFrom,fromEx=state.library.find(e=>e.id===from),toEx=state.library.find(e=>e.id===toId);
  if(!from||from===toId||!toEx){state.mergeFrom=null;render();return}
  let n=0;
  state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===from){e.exerciseId=toId;e.name=toEx.name;n++}}));
  state.plans.forEach(p=>p.sessions.forEach(s=>{s.exercises=s.exercises.filter((ex,i,arr)=>
    !(ex.id===from&&arr.some(o=>o.id===toId)));s.exercises.forEach(ex=>{if(ex.id===from){ex.id=toId;ex.name=toEx.name}})}));
  state.library=state.library.filter(e=>e.id!==from);
  saveJ("logs",state.logs);saveJ("plans",state.plans);saveJ("library",state.library);
  state.mergeFrom=null;render();toast(n+" Einträge übertragen: "+fromEx.name+" → "+toEx.name)}

const RANGES={all:"Gesamt",year:"Jahr",month:"Monat",week:"Woche",last:"Letzte"};
function rangeFilter(ls,r){
  if(r==="all"||!r)return ls;
  if(r==="last")return ls.slice(-1);
  const days={year:365,month:30,week:7}[r];
  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  return ls.filter(l=>l.date>=cut);
}

function growth(pl,allEx){
  const nDeload=pl.filter(l=>l.deload).length;
  pl=pl.filter(l=>!l.deload);
  const perEx=[];
  allEx.forEach(ex=>{const pts=pl.map(l=>{const e=l.entries.find(x=>x.exerciseId===ex.id);if(!e)return null;const b=e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0);return b>0?b:null}).filter(Boolean);
    const grp=MUSCLE_GROUPS[ex.id];
    if(pts.length>=2&&grp)perEx.push({name:ex.name,group:grp,first:pts[0],last:pts[pts.length-1],pct:(pts[pts.length-1]-pts[0])/pts[0]*100})});
  const byG={};perEx.forEach(e=>{(byG[e.group]=byG[e.group]||[]).push(e.pct)});
  const groups=Object.entries(byG).map(([g,a])=>({g,v:Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10})).sort((a,b)=>b.v-a.v);
  return{perEx:perEx.sort((a,b)=>b.pct-a.pct),groups,overall:perEx.length?Math.round(perEx.reduce((a,e)=>a+e.pct,0)/perEx.length*10)/10:null,nDeload};
}

function drawCharts(){
  const p=state.plans.find(x=>x.id===state.statPlan)||activePlan();
  const pl=rangeFilter(state.logs.filter(l=>l.planId===p.id).sort((a,b)=>a.date.localeCompare(b.date)),state.statRange||"all");
  // Gruppen-Balken
  const g=growth(pl,p.sessions.flatMap(s=>s.exercises));
  const gc=$("gchart");
  if(gc&&g.groups.length){
    const max=Math.max(...g.groups.map(x=>Math.abs(x.v)),1);const W=320,rowH=24,H=g.groups.length*rowH;
    let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
    g.groups.forEach((x,i)=>{const y=i*rowH;const bw=Math.abs(x.v)/max*(W-150);
      svg+='<text x="0" y="'+(y+15)+'" fill="#a1a1aa" font-size="10">'+esc(x.g)+'</text>'
      +'<rect x="95" y="'+(y+4)+'" width="'+Math.max(bw,2)+'" height="14" rx="4" fill="'+(x.v>=0?"#34d399":"#ef4444")+'"/>'
      +'<text x="'+(100+Math.max(bw,2))+'" y="'+(y+15)+'" fill="#71717a" font-size="10">'+(x.v>0?"+":"")+x.v+'%</text>'});
    gc.innerHTML=svg+'</svg>';
  }
  // Übungs-Linienchart
  const ec=$("exchart");
  if(ec){
    const data=pl.map(l=>{const e=l.entries.find(x=>x.exerciseId===state.statEx);if(!e)return null;
      return{d:fmtD(l.date),e:e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0),w:e.sets.reduce((a,s)=>Math.max(a,s.w),0)}}).filter(Boolean);
    if(data.length<2){ec.innerHTML='<p class="tiny" style="text-align:center;padding:16px">Mind. 2 Einheiten für den Verlauf nötig.</p>'}
    else{
      const W=320,H=170,P=28;
      const vals=data.flatMap(x=>[x.e,x.w]);const mn=Math.min(...vals)*0.95,mx=Math.max(...vals)*1.05;
      const X=i=>P+i/(data.length-1)*(W-P-8);const Y=v=>H-18-(v-mn)/(mx-mn||1)*(H-34);
      const line=(key,col)=>'<polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+data.map((x,i)=>X(i)+','+Y(x[key])).join(" ")+'"/>'
        +data.map((x,i)=>'<circle cx="'+X(i)+'" cy="'+Y(x[key])+'" r="2.5" fill="'+col+'"/>').join("");
      let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
      [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f;svg+='<line x1="'+P+'" y1="'+Y(v)+'" x2="'+W+'" y2="'+Y(v)+'" stroke="#27272a" stroke-dasharray="3 3"/><text x="0" y="'+(Y(v)+3)+'" fill="#52525b" font-size="9">'+Math.round(v)+'</text>'});
      svg+=line("w","#38bdf8")+line("e","#ef4444");
      data.forEach((x,i)=>{if(data.length<=8||i%2===0||i===data.length-1)svg+='<text x="'+X(i)+'" y="'+(H-4)+'" fill="#52525b" font-size="8" text-anchor="middle">'+x.d+'</text>'});
      svg+='<text x="'+P+'" y="10" fill="#ef4444" font-size="9">— e1RM</text><text x="'+(P+55)+'" y="10" fill="#38bdf8" font-size="9">— Top-Gewicht</text>';
      const d=data[data.length-1].e-data[data.length-2].e;
      ec.innerHTML=svg+'</svg><p class="tiny mono" style="text-align:right;color:'+(d>0?"var(--grn)":d<0?"var(--red2)":"var(--mut)")+'">'+(d>0?"▲ +":d<0?"▼ ":"→ ")+Math.abs(d).toFixed(1)+' e1RM zur Voreinheit</p>';
    }
  }
  // Tonnage-Balken
  const tc=$("tchart");
  if(tc){
    const tonn=pl.map(l=>({d:fmtD(l.date),v:Math.round(l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.w*s.r,0),0))}));
    if(tonn.length>=2){
      const W=320,H=130;const mx=Math.max(...tonn.map(t=>t.v),1);const bw=Math.min(30,(W-20)/tonn.length-4);
      let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
      tonn.forEach((t,i)=>{const x=10+i*((W-20)/tonn.length);const bh=t.v/mx*(H-32);
        svg+='<rect x="'+x+'" y="'+(H-18-bh)+'" width="'+bw+'" height="'+bh+'" rx="3" fill="#ef4444"/>'
        +(tonn.length<=8?'<text x="'+(x+bw/2)+'" y="'+(H-4)+'" fill="#52525b" font-size="8" text-anchor="middle">'+t.d+'</text>':'')});
      tc.innerHTML=svg+'</svg>';
    }
  }
}

const MODELS={"claude-haiku-4-5-20251001":{n:"Haiku 4.5 (günstig)",in:1,out:5},"claude-sonnet-4-6":{n:"Sonnet 4.6 (stärker)",in:3,out:15}};
function aiLogText(scope){
  let ls=state.logs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(scope==="last10")ls=ls.slice(-10);
  return ls.map(l=>{
    const ci=l.checkin&&(l.checkin.gefuehl||l.checkin.schlaf||l.checkin.essen||l.checkin.befinden!=null)
      ?"\n  Check-in: Gefühl="+(l.checkin.gefuehl||"?")+", Schlaf="+(l.checkin.schlaf||"?")+", Essen="+(l.checkin.essen||"?")+", Befinden="+(l.checkin.befinden??"?")+"/10":"";
    return l.date+" "+l.sessionName+(l.deload?" [DELOAD]":"")+":"+ci+"\n"
      +l.entries.map(e=>"  ["+e.exerciseId+"] "+e.name+" (Ziel "+e.reps+", "+e.scheme+"): "
        +e.sets.map(s=>s.w+"kg×"+s.r+(s.rir!=null?" RIR"+s.rir:"")).join(", ")+(e.exNote?' — Notiz: "'+e.exNote+'"':"")).join("\n")
      +(l.note?'\n  Einheits-Notiz: "'+l.note+'"':"")}).join("\n\n");
}
function estCost(scope,model){
  const txt=aiLogText(scope);const inTok=Math.round((txt.length+2200)/4);const outTok=900;const m=MODELS[model];
  return{inTok,cents:Math.round((inTok/1e6*m.in+outTok/1e6*m.out)*100*100)/100};
}

async function runAI(){
  const b=$("aibtn");b.disabled=true;b.textContent="Analysiere…";
  const s=state.settings;const scope=s.aiScope||"last10";const model=s.aiModel||"claude-haiku-4-5-20251001";
  const ids=activePlan().sessions.flatMap(x=>x.exercises).map(e=>e.id+" = "+e.name).join(", ");

  const fb=prev?"\n\nDEINE LETZTE ANALYSE ("+prev.date+"): "+(prev.zusammenfassung||"")+"\nEmpfehlungen damals: "+(prev.empfehlungen||[]).map(r=>r.uebung+" → "+r.ziel).join("; ")+"\nKalibriere dich daran: prüfe, ob umgesetzt und ob es gewirkt hat.":"";
  const prompt=`Du bist mein kritischer, ehrlicher Personal Trainer. Analysiere mein Trainingslog auf Deutsch.

KONTEXT: Männlich, 172cm, ~80kg, 6+ Jahre Training, Aufbauphase (Überschuss ~200-300kcal, Protein ~160g). Training jeden 2. Tag, Split UK A → OK A → UK B → OK B. Arbeitet 65h/Woche, Schlaf knapp (Ziel 7-8h).
REGELN: schwere Hauptübungen RIR-Staffelung 2/2/0 (Sätze 1-2 RIR2, letzter RIR0-1); Isolationsübungen ans Limit (RIR0); Face Pull nur leicht als Prehab (NIE steigern); Seitheben Antest-Phase RIR2-3; Straps bei allen Zügen; KEIN direkter Bizeps (Arm in ärztlicher Abklärung: Streckdefizit, gereizte Bizepssehne, Unterarm); keine volle Ellenbogen-Endstreckung unter Last; Schulter frisch auskuriert, BWS labil.
Progression: Wdh im Zielbereich hoch, dann +2,5kg. [DELOAD] markierte Einheiten sind bewusst reduziert (−30%) und zählen NICHT als Leistungsrückgang.

MEIN LOG:
${aiLogText(scope)}${fb}

Verfügbare exerciseIds: ${ids}

Antworte NUR mit validem JSON, ohne Markdown-Zäune:
{"zusammenfassung":"3-4 Sätze Gesamturteil","empfehlungen":[{"exerciseId":"schraegbank","uebung":"Schrägbankdrücken KH","ziel":"30kg × 8-12, 2/2/0","gewicht":30,"grund":"max 8 Wörter"}],"warnungen":["konkrete Warnsignale"]}

Regeln: max 6 Empfehlungen, wichtigste zuerst, nur wo Handlungsbedarf besteht. Notizen und Check-ins sind Pflichtlektüre — korreliere sie mit der Leistung (schwache Einheit nach schlechtem Schlaf/wenig Essen = Erholungsthema, nicht Trainingsschwäche). Notizen zu Gelenken/Reizungen haben höchste Priorität und überstimmen jede Progressionsempfehlung. Face Pull nie steigern.`;
  try{

      headers:{"Content-Type":"application/json","x-api-key":s.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},

    state.analyses=[...(state.analyses||[]),entry];saveJ("analyses",state.analyses);
    render();toast("Analyse fertig ✓");
  }catch(e){
    $("airesult").innerHTML='<div class="card" style="border-color:var(--red2)"><p class="tiny" style="color:var(--red2)">Analyse fehlgeschlagen: '+esc(e.message)+'</p><p class="tiny" style="margin-top:4px">Prüfe Schlüssel, Guthaben (console.anthropic.com → Billing) und Internetverbindung.</p></div>';

}
function resetCycle(){state.settings.cycleStart=todayISO();saveJ("settings",state.settings);state.tab="training";render();toast("Neuer Zyklus gestartet")}
function pauseAsDeload(){state.settings.cycleStart=todayISO();saveJ("settings",state.settings);render();toast("Pause als Deload gewertet — neuer Zyklus ✓")}
// ================= Kalender =================
function vCal(){
  if(!state.calMonth)state.calMonth=todayISO().slice(0,7);
  const[Y,M]=state.calMonth.split("-").map(Number);
  const first=new Date(Y,M-1,1);const days=new Date(Y,M,0).getDate();
  const startDow=(first.getDay()+6)%7; // Mo=0
  const monthName=first.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  if(!state.settings.plannedDeload){state.settings.plannedDeload=suggestDeloadDate();saveJ("settings",state.settings)}
  const pdIso=state.settings.plannedDeload;
  const byDate={};state.logs.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l)});
  const badge={"uk-a":"UKA","ok-a":"OKA","uk-b":"UKB","ok-b":"OKB"};
  let h='<div class="row" style="justify-content:space-between"><button class="chip" onclick="calShift(-1)">◀</button><b style="font-size:16px">'+monthName+'</b><button class="chip" onclick="calShift(1)">▶</button></div>';
  h+='<div class="card" style="padding:10px"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">';
  ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(d=>h+='<span class="tiny" style="font-weight:800">'+d+'</span>');
  for(let i=0;i<startDow;i++)h+='<span></span>';
  const today=todayISO();
  for(let d=1;d<=days;d++){
    const iso=Y+"-"+String(M).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const sess=byDate[iso]||[];const isToday=iso===today;
    const isAbs=(state.settings.absences||[]).some(a=>a.from<=iso&&a.to>=iso);
    const isPD=state.settings.plannedDeload===iso;
    const sel=state.calSel===iso;
    let cell='<button style="min-height:46px;border-radius:9px;border:1px solid '+(sel?"var(--red2)":isPD?"var(--amb)":isToday?"var(--s3)":"transparent")+';background:'+(sess.length?(sess.some(l=>l.deload)?"rgba(245,158,11,.15)":"rgba(220,38,38,.14)"):isPD?"rgba(245,158,11,.08)":isAbs?"rgba(56,189,248,.13)":"var(--s1)")+';color:var(--tx);padding:3px 1px;display:flex;flex-direction:column;align-items:center;gap:1px" onclick="calPick(\''+iso+'\')">'
    +'<span class="tiny" style="'+(isToday?"color:var(--red2);font-weight:800":isPD?"color:var(--amb);font-weight:800":isAbs?"color:var(--sky)":"")+'">'+d+'</span>';
    if(isPD&&!sess.length)cell+='<span style="font-size:8px;font-weight:800;color:var(--amb)">DL</span>';
    else if(isAbs&&!sess.length)cell+='<span style="font-size:9px">🏖</span>';
    sess.forEach(l=>{cell+='<span style="font-size:8px;font-weight:800;color:'+(l.deload?"var(--amb)":"var(--red2)")+'">'+(badge[l.sessionId]||l.sessionName.slice(0,3))+'</span>'});
    cell+='</button>';h+=cell;
  }
  h+='</div></div>';
  h+='<p class="tiny" style="text-align:center">'+(pdIso?'⚠️ Deload geplant ab <b style="color:var(--amb)">'+fmtD(pdIso)+'</b> · Tag antippen zum Umplanen':'')+'</p>';
  // Aktionen für ausgewählten Tag
  if(state.calSel){
    const iso=state.calSel;const hasSess=(byDate[iso]||[]).length;
    const absHere=(state.settings.absences||[]).find(a=>a.from<=iso&&a.to>=iso);
    const isPD=state.settings.plannedDeload===iso;
    h+='<div class="card" style="padding:10px 12px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b style="font-size:14px">'+fmtD(iso)+'</b><button class="chip" style="padding:3px 9px" onclick="state.calSel=null;state.absTmp=null;render()">✕</button></div>';
    if(state.absTmp)h+='<button class="chip" style="width:100%;padding:9px;color:var(--sky);margin-bottom:5px" onclick="finishAbs(\''+iso+'\')">🏖 Urlaub '+fmtD(state.absTmp)+' – '+fmtD(iso)+' speichern</button><button class="chip" style="width:100%;padding:7px" onclick="state.absTmp=null;render()">Abbrechen</button>';
    else{
      h+='<div class="row" style="gap:5px;flex-wrap:wrap">';
      if(absHere)h+='<button class="chip" style="flex:1;padding:8px;color:var(--red2)" onclick="delAbs(\''+absHere.from+'\')">🏖 Urlaub entfernen</button>';
      else h+='<button class="chip" style="flex:1;padding:8px;color:var(--sky)" onclick="state.absTmp=\''+iso+'\';render()">🏖 Urlaub ab hier</button>';
      if(isPD)h+='<button class="chip" style="flex:1;padding:8px;color:var(--red2)" onclick="clearPlannedDeload()">Deload-Termin löschen</button>';
      else h+='<button class="chip" style="flex:1;padding:8px;color:var(--amb)" onclick="planDeloadOn(\''+iso+'\')">⚠️ Deload hierhin planen</button>';
      h+='</div>';
      if(!hasSess)h+='<p class="tiny" style="margin-top:5px">Kein Training an diesem Tag.</p>';
    }
    h+='</div>';
  }
  if(state.calSel&&byDate[state.calSel]){
    byDate[state.calSel].forEach(l=>{
      h+='<div class="card" style="border-color:var(--red2)"><div class="row" style="justify-content:space-between"><b>'+esc(l.sessionName)+(l.deload?' <span style="color:var(--amb);font-size:10px;font-weight:800;border:1px solid var(--amb);border-radius:5px;padding:1px 5px">DELOAD</span>':'')+'</b><span class="row" style="gap:6px"><span class="tiny mono">'+fmtD(l.date)+'</span><button class="chip" style="padding:3px 9px" onclick="state.calSel=null;render()">✕ Schließen</button></span></div><div style="margin-top:6px;display:flex;flex-direction:column;gap:4px">';
      if(l.checkin&&(l.checkin.gefuehl||l.checkin.schlaf||l.checkin.essen||l.checkin.befinden!=null))h+='<p class="tiny mono">Check-in: '+(l.checkin.gefuehl?'Gefühl '+l.checkin.gefuehl:'')+(l.checkin.schlaf?' · Schlaf '+l.checkin.schlaf:'')+(l.checkin.essen?' · Essen '+l.checkin.essen:'')+(l.checkin.befinden!=null?' · Befinden '+l.checkin.befinden+'/10':'')+'</p>';
      l.entries.forEach(e=>{h+='<p class="tiny mono" style="color:var(--mut)"><span style="color:var(--tx)">'+esc(e.name)+':</span> '+e.sets.map(s=>s.w+'×'+s.r+(s.rir!=null?'@'+s.rir:'')).join(' | ')+(e.exNote?' <span class="note-a">— „'+esc(e.exNote)+'"</span>':'')+'</p>'});
      if(l.note)h+='<p class="note-a" style="font-style:italic">„'+esc(l.note)+'"</p>';
      h+='<button class="del'+(state.confirmDel==="h:"+l.id?" sure":"")+'" style="align-self:flex-start;margin-top:4px" onclick="delLog(\''+l.id+'\')">'+(state.confirmDel==="h:"+l.id?"Wirklich löschen?":"Eintrag löschen")+'</button>';
      h+='</div></div>'});
  }
  return h;
}
function calShift(d){const[Y,M]=state.calMonth.split("-").map(Number);const nd=new Date(Y,M-1+d,1);state.calMonth=nd.getFullYear()+"-"+String(nd.getMonth()+1).padStart(2,"0");state.calSel=null;render()}
function calPick(iso){state.calSel=state.calSel===iso?null:iso;render()}
function addAbs(){const f=$("absfrom").value,t=$("absto").value;if(!f||!t){toast("Von- und Bis-Datum wählen");return}
  if(t<f){toast("Bis-Datum liegt vor Von-Datum");return}
  state.settings.absences=[...(state.settings.absences||[]),{from:f,to:t,note:($("absnote").value||"").trim()}];
  saveJ("settings",state.settings);render();toast("Abwesenheit eingetragen")}
function delAbs(from){state.settings.absences=(state.settings.absences||[]).filter(a=>a.from!==from);saveJ("settings",state.settings);render();toast("Abwesenheit gelöscht")}
function finishAbs(to){
  let from=state.absTmp;if(!from)return;
  if(to<from){const t=from;from=to;to=t}
  state.settings.absences=[...(state.settings.absences||[]),{from,to,note:"Urlaub"}];
  saveJ("settings",state.settings);state.absTmp=null;state.calSel=null;render();toast("Urlaub "+fmtD(from)+" – "+fmtD(to)+" eingetragen")}
function planDeloadOn(iso){state.settings.plannedDeload=iso;saveJ("settings",state.settings);render();toast("Deload geplant ab "+fmtD(iso))}
function suggestDeloadDate(){
  const rest=DELOAD_AFTER-sessionsSinceCycle();
  const ls=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date));
  const base=ls.length?new Date(ls[ls.length-1].date):new Date();
  return new Date(base.getTime()+Math.max(rest,1)*2*864e5).toISOString().slice(0,10);
}
function setPlannedDeload(){const v=$("pdate")?$("pdate").value:"";if(!v){toast("Datum wählen");return}
  state.settings.plannedDeload=v;saveJ("settings",state.settings);render();toast("Deload geplant ab "+fmtD(v))}
function clearPlannedDeload(){delete state.settings.plannedDeload;saveJ("settings",state.settings);render();toast("Geplanter Deload entfernt")}
// Start
boot();
</script>
