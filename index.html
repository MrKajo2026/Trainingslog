<meta name="apple-mobile-web-app-title" content="Trainingslog">
<title>Trainingslog</title>
<style>
:root{--bg:#0c0c0e;--s1:#18181b;--s2:#27272a;--s3:#3f3f46;--tx:#f4f4f5;--mut:#71717a;--dim:#52525b;--red:#dc2626;--red2:#ef4444;--grn:#34d399;--grn2:#10b981;--amb:#f59e0b;--sky:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg)}body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;height:100vh;height:var(--app-h,100vh);overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
header{position:relative;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--s2);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 10px;z-index:10}
header h1{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;display:inline}
#hinfo{float:right;font-size:11px;color:var(--mut)}
main{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior-y:contain}main>*{flex-shrink:0}
nav{position:relative;flex-shrink:0;width:100%;display:flex;background:var(--s1);border-top:1px solid var(--s2);z-index:30;padding-top:4px;padding-bottom:max(calc(env(safe-area-inset-bottom,0px) - 14px),6px)}
nav button:active{background:rgba(239,68,68,.15)}
nav button{flex:1;min-width:0;min-height:60px;padding:19px 2px;background:none;border:none;color:var(--mut);font-size:clamp(9px,2.7vw,12px);font-weight:700;text-transform:uppercase;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button.on{color:var(--red2);border-top:2px solid #dcdcdc;margin-top:-1px}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:14px;padding:14px}
.card.hl{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.45)}
.card.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.4)}
.card.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.35)}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:800;font-size:14px}
.btn.red{background:var(--red);color:#fff}.btn.dim{background:var(--s2);color:var(--mut)}.btn.grn{background:var(--grn2);color:#fff}.btn.amb{background:var(--amb);color:#111}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.small{font-size:12px;color:var(--mut)}.tiny{font-size:11px;color:var(--dim)}
.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.chip{padding:6px 10px;border-radius:8px;border:none;background:var(--s2);color:var(--mut);font-size:12px;font-weight:700}
.chip.on-g{background:var(--grn2);color:#fff}.chip.on-n{background:var(--s3);color:#fff}.chip.on-r{background:var(--red);color:#fff}.chip.on-a{background:var(--amb);color:#111}
input[type=text],textarea,select{background:var(--s2);border:1px solid var(--s3);border-radius:9px;color:var(--tx);padding:9px 10px;font-size:16px;width:100%;font-family:inherit;-webkit-appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--red2)}
.win{width:100%;text-align:center;font-size:15px;padding:9px 2px}.winr{width:100%;text-align:center;font-size:15px;padding:9px 2px}
.setrow{display:flex;align-items:center;gap:4px;background:rgba(63,63,70,.22);border-radius:10px;padding:5px 6px}
.rir{width:26px;height:30px;border-radius:6px;font-size:11px}
.rir{width:33px;height:33px;border-radius:8px;border:none;background:var(--s2);color:var(--dim);font-weight:800;font-size:12px}
.rir.g{background:var(--grn);color:#052}.rir.y{background:var(--amb);color:#210}.rir.r{background:var(--red);color:#fff}.rir.d{background:var(--s3);color:#fff}
.exname{font-weight:700;font-size:14px}
.rec{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--grn);border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0}
.note-a{color:rgba(245,158,11,.85);font-size:12px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.hrow{display:flex;justify-content:space-between;padding:10px 0 4px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat3 .card{text-align:center;padding:12px 6px}
.stat3 b{font-size:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--s1);border-top:1px solid var(--s3);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow-y:auto}
.libitem{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--s3);border-radius:9px;padding:10px;margin-top:6px;color:var(--tx);font-size:13px}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--grn2);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.swap{color:var(--sky);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);border-radius:7px;padding:3px 9px;font-size:13px;font-weight:800}
svg text{font-family:ui-monospace,Menlo,monospace}
input[type=range]{width:100%;accent-color:var(--red2)}

header .hlogo{grid-row:1;height:calc(clamp(19px,5.6vw,23px) * 1.1 + 16px);width:auto;mix-blend-mode:lighten;display:block}
header .htxt{grid-row:1;min-width:0}header h1{display:block!important;line-height:1.1;margin:0}
#hinfo{display:block!important;font-size:11px!important;line-height:14px;margin-top:2px}
#hbanner{grid-column:1/-1;margin-top:10px}#hbanner:empty{display:none}
header{display:block!important;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0!important}

#hinfo{position:absolute!important;left:0;right:0;bottom:-5px;display:flex!important;justify-content:center;gap:17%;margin:0!important;font-size:10px!important;line-height:12px;color:var(--mut)}
#hinfo span:first-child{flex:1;text-align:right}#hinfo span:last-child{flex:1;text-align:left}
#hinfo{top:78%!important;bottom:auto!important;transform:translateY(-50%);left:-13%!important;right:-13%!important;justify-content:space-between!important;gap:0!important}#hinfo span{flex:none!important;text-align:center!important}
/* Chrom-Ton aus dem Logo für Werte und aktive Funktionen */
:root{--chrome:linear-gradient(180deg,#f6f6f6 0%,#d4d4d4 45%,#9d9d9d 56%,#ededed 100%)}
.h-t b{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.btn.red{background:var(--chrome)!important;color:#0b0b0b!important;box-shadow:inset 0 1px 0 #fff}
.chip.on-r,.p-tabs button.on{background:var(--chrome)!important;color:#0b0b0b!important;border-color:#cfcfcf!important}
input:focus,textarea:focus{border-color:#cfcfcf!important}
button.chip[style*="--red2"]{color:#e2e2e2!important}
.s-hb b{font-size:16px}.s-h .s-hv{font-size:20px!important;font-weight:800;color:var(--tx)}
.k-lab.tr,.c-leg .k-lab.tr{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.s-h .s-chr{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent!important}
/* Tagesleiste in Logofarben */
.h-d.done{border-color:rgba(220,220,220,.45)}
.h-d.done em{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-d.plan{border-color:rgba(200,200,200,.35)}.h-d.plan em{color:var(--mut)}
.h-d.now,.h-d.now.plan,.h-d.now.plan.dl{background:var(--chrome);border-color:#e6e6e6;color:#0b0b0b}
.h-d.now small,.h-d.now em,.h-d.now.plan em,.h-d.now.plan.dl em{color:#2a2a2a;-webkit-text-fill-color:#2a2a2a;background:none}
.h-d.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #d8d8d8,0 6px 16px rgba(255,255,255,.12)}
.p-sel{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--tx);font-size:20px;font-weight:800;padding:0}
.p-sel i{font-style:normal;font-size:11px;color:var(--mut);border:1px solid var(--s2);border-radius:6px;padding:2px 6px}
.lib-sheet{height:86vh;max-height:86vh;overflow:hidden!important;display:flex;flex-direction:column}.lib-sheet>*{flex-shrink:0}.lib-sheet>#libList{flex:1 1 auto;flex-shrink:1}.lib-sheet #libList{overflow-y:auto;flex:1;min-height:0}
.lib-chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:2px}.lib-chips span{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--s2);color:var(--mut);white-space:nowrap;cursor:pointer}.lib-chips span.on{background:var(--chrome);color:#0b0b0b}
.lib-r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--s2);cursor:pointer}.lib-r .n{flex:1;min-width:0}.lib-r .n b{display:block;font-size:14px}.lib-r .n span{font-size:11px;color:var(--mut)}
.lib-tag{font-size:10px!important;font-weight:700;border-radius:5px;padding:2px 6px;background:rgba(220,220,220,.12);color:#dcdcdc!important;margin-left:4px;white-space:nowrap}.lib-tag.off{background:none;border:1px dashed var(--s3);color:var(--mut)!important}
.lib-w{text-align:right;flex-shrink:0}.lib-w b{font-size:14px;display:block}.lib-w span{font-size:10px}
.lib-open{background:var(--s2);border-radius:10px;padding:10px;margin:2px 0 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.lib-open .chip{flex:1;text-align:center;padding:8px;background:var(--s1)}
.h-tiles.t4{grid-template-columns:repeat(4,1fr);gap:6px}.h-tiles.t4 .h-t{padding:9px 8px}.h-tiles.t4 .h-t b{font-size:17px}.h-tiles.t4 .h-t span{font-size:10.5px}
.k-d.now b{background:var(--chrome)!important;color:#0b0b0b!important}
/* Tagesleiste: immer 7 ganze Tage sichtbar, kein Anschnitt */
.h-scroll{scroll-snap-type:x mandatory!important;padding:10px 0 10px!important;scroll-padding:0}
.h-scroll .h-d,.h-scroll .h-d.now{flex:0 0 calc((100% - 30px)/7)!important;scroll-snap-align:start!important}
.h-d.now{transform:translateY(-3px)}
.h-t.f-t{align-items:center;text-align:center;justify-content:flex-start;gap:0;padding:9px 4px 11px!important}.h-t.f-t em{font-style:normal;font-size:9.5px;color:var(--dim);margin:1px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.h-t.f-t span{font-size:11px!important;color:var(--mut);font-weight:600}.h-t.f-t b{font-size:19px!important}.h-t.f-t b small{font-size:11px}
.xc{background:linear-gradient(180deg,#19191b,#141416);border:1px solid var(--s2);border-radius:14px;overflow:hidden;margin-top:10px;cursor:pointer}.xc.on{border-color:#8a8a8e}
.xc-top{display:flex;gap:11px;padding:10px}
.xc-img{width:84px;height:84px;border-radius:11px;flex-shrink:0;background:radial-gradient(circle at 50% 38%,#2e2e32,#141416 72%);display:grid;place-items:center}.xc-img svg{width:80px;height:80px}
.xc-h{flex:1;min-width:0}.xc-h b{display:block;font-size:15px;line-height:1.2}.xc-sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.xc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.xc-tags span{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 7px;background:rgba(220,220,220,.1);color:#dcdcdc}.xc-tags span.off{background:none;border:1px dashed var(--s3);color:var(--mut)}
.xc-w{text-align:right;flex-shrink:0}.xc-w b{font-size:15px;display:block}.xc-w span{font-size:10.5px}
.xc-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--s2)}.xc-grid div{padding:7px 4px;text-align:center;border-left:1px solid var(--s2)}.xc-grid div:first-child{border-left:none}.xc-grid small{display:block;font-size:9.5px;color:var(--mut)}.xc-grid b{font-size:13px}
.xc-info{border-top:1px solid var(--s2);padding:8px 11px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#c8c8cc}.xc-info div{display:flex;gap:8px}.xc-info i{font-style:normal;color:var(--mut);flex:0 0 90px}
.lib-open{margin-top:6px}
.h-scroll .h-d{padding:4px 0 5px!important}.h-d small{font-size:9.5px}.h-d b{font-size:14px;margin-top:0}.h-d em{margin-top:2px;min-height:11px;font-size:9px}.h-d.now b{font-size:16px}
/* Pictogramme in Listen */
.pi{flex-shrink:0;border-radius:9px;background:radial-gradient(circle at 50% 38%,#2e2e32,#141416 72%);display:inline-grid;place-items:center;overflow:hidden}.pi svg{width:100%;height:100%;display:block}
.pi.s32{width:32px;height:32px;border-radius:8px}.pi.s34{width:34px;height:34px;border-radius:8px}.pi.s52{width:52px;height:52px;border-radius:11px}.pi.s60{width:60px;height:60px;border-radius:12px}
.l-row .l-rn{flex:1;min-width:0}
main.tight{gap:8px;padding-top:10px}main.tight .h-wk.wcard{padding:6px 8px 4px}main.tight .h-wk.wcard .h-a{height:30px}main.tight .h-hero{gap:2px}main.tight .h-mid b{font-size:30px}main.tight .h-mid .tiny{font-size:10.5px}main.tight .h-st{font-size:12px}main.tight .h-st{margin:1px 0 2px}main.tight .h-hint{margin-top:-4px}main.tight .h-hero{padding:10px 16px}main.tight .h-t{padding:8px 10px}main.tight .h-go{padding:11px}main.tight .h-days{margin-top:4px}main.tight .h-scroll{padding:6px 0!important}
#wkstrip .h-d em{display:flex;justify-content:center;align-items:center;gap:2px;padding:0;overflow:hidden;text-overflow:clip}#wkstrip .h-d em>span:first-child{flex-shrink:0}
.wg{font-style:normal;font-weight:400;font-size:9.5px;color:var(--mut)}.wg.no{color:var(--amb);font-weight:600}.wsep{color:var(--s3);font-weight:400}
.h-d.now .wg{color:#3a3a3a}.h-d.now .wg.no{color:#b45309}.h-d.now .wsep{color:#777}
.k-wg{display:block;font-style:normal;font-size:9.5px;font-weight:700;color:var(--mut);line-height:1.1}.k-wg.no{color:var(--amb)}
.k-d{gap:3px}.k-d .k-lab{min-height:11px}
.l-pb i{background:var(--chrome)!important}
.h-tiles:not(.t4) .h-t.f-t{gap:2px;padding:7px 4px 8px!important}.h-tiles:not(.t4) .h-t.f-t b{font-size:18px!important}
.h-kw{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:36px}
.h-wk.wcard{background:var(--s1);border:1px solid var(--s2);border-radius:22px;padding:10px 10px 6px}
.h-wk.wcard #hdaycard{margin-top:4px}.h-wk.wcard .k-sheet.k-home{background:none;border:none;border-top:1px solid var(--s2);border-radius:0;padding:10px 0 4px}
/* Startseite kompakt: alles etwas kleiner, damit Ring + Funktionsleiste ohne Scrollen passen */
main.fill:has(.h-hero){gap:8px;padding-top:8px}
header .htxt{width:70%!important}header{padding-bottom:0!important}
main.fill .h-hero{padding:10px 14px 8px}
main.fill .h-go{height:46px;margin-top:8px;font-size:16px}
main.fill .h-other{margin-top:4px;padding:2px}
main.fill .h-wk.wcard{padding:6px 8px 4px}main.fill .h-wk.wcard .h-a{height:30px;width:38px}
main.fill .h-wk.wcard .h-kw{min-height:30px}
main.fill .h-tiles .h-t.f-t{padding:6px 4px 7px!important}
main.fill .k-sheet.k-home{padding-top:8px}
.l-tt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}.l-tn{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.l-tm{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#restdark .rd-s{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:190px}#restdark .rd-n{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#restdark .rd-m{font-size:12px;opacity:.85;white-space:nowrap}
#restdark .rd-next{position:absolute;left:24px;right:24px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#111113;border:1px solid #1f1f22}
#restdark .rd-next .pi{opacity:.75}#restdark.end .rd-next{background:#18181b;border-color:#27272a}#restdark.end .rd-next .pi{opacity:1}#restdark.end .rd-nn{color:#e4e4e7}#restdark.end .rd-nl,#restdark.end .rd-nm{color:#a1a1aa}#restdark .rd-nl{font-size:11px;color:#5a5a60}#restdark .rd-nn{font-size:15px;font-weight:700;color:#8a8a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#restdark .rd-nm{font-size:12px;color:#5a5a60}

const e1rm=(w0,r0,rir)=>{const w=num(w0),r=num(r0); // Epley mit RIR-Korrektur; nur im validen Bereich
  const eff=r+(rir==null?0:Math.min(rir,4));

function rirRange(scheme,si,n){
  if(!scheme)return null;
  const m=scheme.match(/(\d)(?:\/(\d))+/);
  const pat=(scheme.match(/\b\d(?:\/\d)+\b/)||[])[0];
  if(pat){                                   // z.B. 2/2/0 oder 2/2/1
    const arr=pat.split("/").map(Number);
    let v;
    if(n<=arr.length)v=(si===n-1)?arr[arr.length-1]:arr[si];      // weniger Sätze: letzter Wert bleibt letzter Satz
    else v=(si===n-1)?arr[arr.length-1]:arr[Math.min(si,arr.length-2)]; // mehr Sätze: vorletzten Wert wiederholen

    return (si===n-1&&v===0)?[0,1]:[v,v];

}

    .map(l=>{const e=l.entries.find(x=>x.exerciseId===exId);if(!e)return null;
      const w=Math.max(...e.sets.map(s=>+s.w||0));return w>0?w:null}).filter(Boolean);

function performanceDrop(){
  const cut=new Date(Date.now()-21*864e5).toISOString().slice(0,10);
  const from=[state.settings.cycleStart||"",cut].sort().pop();
  const ls=state.logs.filter(l=>!l.deload&&!l.reentry&&!l.altGym&&l.date>=from).sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);   // 2 Durchläufe: jede Übung mind. 2×
  if(ls.length<6)return 0;

  ls.forEach((l,i)=>l.entries.forEach(e=>{if(!MUSCLE_GROUPS[e.exerciseId])return;
    const b=e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r,s.rir)),0);if(b>0)(byEx[e.exerciseId]=byEx[e.exerciseId]||[]).push(b)}));
  let drop=0,tot=0;
  Object.values(byEx).forEach(v=>{if(v.length<2)return;tot++;if(v[v.length-1]<Math.max(...v.slice(0,-1))*0.97)drop++});
  return tot>=6&&drop/tot>=0.5?drop:0;
}

function stagnationFor(exId){
  const pts=state.logs.filter(l=>!l.deload&&!l.reentry&&!l.altGym).sort((a,b)=>a.date.localeCompare(b.date))
    .map(l=>{const e=l.entries.find(x=>x.exerciseId===exId);if(!e)return null;
      const b=e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r)),0);return b>0?{v:b,date:l.date,rir:e.sets.map(s=>s.rir)}:null}).filter(Boolean);
  if(pts.length<3)return null;
  const last3=pts.slice(-3);const best=Math.max(...pts.slice(0,-3).map(p=>p.v),last3[0].v);
  const noGain=last3.every(p=>p.v<=best*1.005);
  if(!noGain)return null;
  const n=pts.length-pts.findIndex(p=>p.v>=best*0.995);
  const allOut=last3.every(p=>p.rir.some(r=>r===0));
  if(pts.length>=5&&last3.every((p,i)=>i===0||p.v<=last3[i-1].v*1.001)&&allOut)
    return{lvl:2,txt:"Stagnation über "+last3.length+" Einheiten trotz RIR0 → Übungs-Deload empfohlen: −10% für 1 Einheit, dann neu aufbauen",w:null};

}
function recommendFor(entry){
  if(/prehab/i.test(entry.scheme||""))return null;
  const last=lastByEx()[entry.exerciseId];if(!last)return null;
  const ls=last.sets.filter(s=>s.r>0);if(!ls.length)return null;
  const m=(entry.reps||"").match(/(\d+)\s*-\s*(\d+)/);if(!m)return null;
  const lo=+m[1],hi=+m[2];
  const w=num(ls[0].w);if(!w)return null;
  const mmI=MUSCLE_MAP[entry.exerciseId];
  const iso=/^1\//.test(entry.scheme||"")||/limit|RIR2|Core|Prehab/i.test(entry.scheme||"")||(mmI&&(!mmI.s||!mmI.s.length));
  const step=stepFor(w,iso);
  const allTop=ls.every(x=>x.r>=hi)||(ls.every(x=>x.r>=hi-1)&&ls[0].r>=hi&&(ls[0].rir??0)>=2);  // alle oben, oder fast alle oben + deutliche Reserve
  const anyBelow=ls.filter(x=>x.r<lo).length;
  // Deutlich über dem Zielbereich (alle Sätze ≥ obere Grenze +2, keiner am Limit) → doppelter Schritt
  if(allTop&&ls.every(x=>x.r>=hi+2&&(x.rir??0)>=1))return{w:roundPlate(w+2*step),txt:"+"+(2*step)+"kg — klar über Zielbereich ("+ls.map(x=>x.r).join("/")+")"};
  if(allTop)return{w:roundPlate(w+step),txt:"+"+step+"kg — alle Sätze am oberen Zielrand ("+ls.map(x=>x.r).join("/")+")"};
  if(anyBelow>=Math.ceil(ls.length/2)){
    const allOut=ls.every(x=>x.rir===0);
    const withReserve=ls.every(x=>x.rir!=null&&x.rir<=2);
    if(allOut)return{w:roundPlate(Math.max(w-step,step)),txt:"−"+step+"kg — mehrheitlich unter Zielbereich trotz RIR0"};
    if(withReserve)return{w:roundPlate(Math.max(w-2*step,step)),txt:"−"+(2*step)+"kg — unter Zielbereich schon mit Reserve, Gewicht zu hoch"};
  }
  if(ls[0].r>=hi)return{w:w,txt:"Gewicht halten — erst alle Sätze auf "+hi+" Wdh bringen (aktuell "+ls.map(x=>x.r).join("/")+")",hold:true};

function weightTrend(){

// Trainingszeiten aus Satz-Zeitstempeln (t = Satz eingetragen)
// Vorlauf: Einheit geöffnet → 1. Satz (Anfahrt/Aufwärmen) · Brutto: geöffnet → letzter Satz (+1 min)
// Netto: Satzabstände, je Abstand gedeckelt auf geplante Pause + 3 min (gleiche Übung) bzw. + 6 min (Übungswechsel),
// längere Lücken = Unterbrechung; +2 min für ersten/letzten Satz
function calcTimes(l){
  const pts=[];(l.entries||[]).forEach((e,ei)=>(e.sets||[]).forEach(x=>{if(x.t)pts.push({t:x.t,ei,rest:num(e.rest)||120})}));
  pts.sort((a,b)=>a.t-b.t);
  const r={pre:null,brutto:null,netto:null};
  if(pts.length>=3){
    let sum=0;
    for(let i=1;i<pts.length;i++){const p=pts[i-1],same=pts[i].ei===p.ei;
      sum+=Math.min(pts[i].t-p.t,(p.rest+(same?180:360))*1000)}
    r.netto=Math.round(sum/60000)+2;
    if(l.startedAt&&l.startedAt<=pts[0].t){
      r.pre=Math.round((pts[0].t-l.startedAt)/60000);
      r.brutto=Math.round((pts[pts.length-1].t-l.startedAt)/60000)+1;
      r.netto+=Math.min(r.pre,10);          // Aufwärmen vor dem 1. Satz zählt mit, max. 10 min
    }
  }
  return r;
}

// ===== Übungs-Pictogramme (eigene Vektorzeichnungen) =====
const pi=(id,n,c)=>'<span class="pi '+c+'">'+PICTO.svg(id,n)+'</span>';
const PICTO=(()=>{
  const R="#e0473c",SK="#c9c9ce",SKD="#8e8e94",MC="#6e6e74",PAD="#3b3b40";
  const f=n=>n.toFixed(1);
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k],len=a=>Math.hypot(a[0],a[1])||1,nrm=a=>mul(a,1/len(a)),perp=a=>[-a[1],a[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
  // Gliedmaße als verjüngte Form mit runden Enden; bulge = Muskelbauch
  function limb(p,q,w1,w2,col,bulge){const d=nrm(sub(q,p)),n=perp(d),L=len(sub(q,p));bulge=bulge||0;
    const pts=[];const N=8;
    for(let i=0;i<=N;i++){const t=i/N,w=(w1+(w2-w1)*t)/2+bulge*Math.sin(Math.PI*Math.min(1,t*1.25))*0.5;pts.push(add(add(p,mul(d,L*t)),mul(n,w)))}
    for(let i=N;i>=0;i--){const t=i/N,w=(w1+(w2-w1)*t)/2+bulge*Math.sin(Math.PI*Math.min(1,t*1.25))*0.5;pts.push(add(add(p,mul(d,L*t)),mul(n,-w)))}
    return '<path fill="'+col+'" d="M'+pts.map(x=>f(x[0])+' '+f(x[1])).join('L')+'Z"/><circle cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="'+f(w1/2)+'" fill="'+col+'"/><circle cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+f(w2/2)+'" fill="'+col+'"/>'}
  // Muskel-Hervorhebung: Ellipse entlang eines Segments, seitlich versetzt
  function musc(p,q,from,to,off,w,col){const d=nrm(sub(q,p)),n=perp(d),L=len(sub(q,p));
    const c=add(add(p,mul(d,L*(from+to)/2)),mul(n,off)),ang=Math.atan2(d[1],d[0])*180/Math.PI;
    return '<ellipse cx="'+f(c[0])+'" cy="'+f(c[1])+'" rx="'+f(L*(to-from)/2)+'" ry="'+f(w/2)+'" transform="rotate('+f(ang)+' '+f(c[0])+' '+f(c[1])+')" fill="'+(col||R)+'"/>'}
  // Seite eines Segments bestimmen: +1 wenn Normale zum Referenzvektor zeigt
  const side=(p,q,ref)=>dot(perp(nrm(sub(q,p))),ref)>=0?1:-1;
  function figure(j,hl){
    const fac=j.face||1,o=[3*fac,-2.5];   // hinteres Bein/Arm leicht versetzt
    const far=k=>j[k+"2"]||add(j[k],o);
    let s='';
    // hintere Gliedmaßen dunkler
    s+=limb(far("hip"),far("knee"),10,7,SKD,1.2)+limb(far("knee"),far("ankle"),7,4.5,SKD,1.4)+limb(far("ankle"),far("toe"),3.6,2.6,SKD);
    s+=limb(far("sh"),far("el"),6.4,5,SKD,1)+limb(far("el"),far("hand"),5,3.8,SKD,.6)+'<circle cx="'+f(far("hand")[0])+'" cy="'+f(far("hand")[1])+'" r="2.6" fill="'+SKD+'"/>';
    // Rumpf: Brustkorb breiter, Taille schmaler
    const up=nrm(sub(j.sh,j.hip)),n=perp(up),fr=side(j.hip,j.sh,[fac,0])>0?n:mul(n,-1);
    const chest=add(add(j.hip,mul(sub(j.sh,j.hip),.72)),mul(fr,2.2));
    s+=limb(j.hip,chest,13,15.5,SK,.5)+limb(chest,j.sh,15.5,11,SK);
    // Hals + Kopf
    const neck=add(j.sh,mul(sub(j.head,j.sh),.45));
    s+=limb(j.sh,neck,5.5,5,SK)+'<ellipse cx="'+f(j.head[0])+'" cy="'+f(j.head[1])+'" rx="6" ry="6.8" fill="'+SK+'"/>';
    // Muskeln am Rumpf
    const tf=side(j.hip,j.sh,fr);
    if(hl.includes("chest"))s+=musc(j.hip,j.sh,.62,.92,tf*4.2,7);
    if(hl.includes("abs"))s+=musc(j.hip,j.sh,.12,.58,tf*4,6);

  state.logs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    l.entries.forEach(e=>{
      const bw=/BW|Core/i.test(e.scheme||"");
      const prev=byEx[e.exerciseId];
      if(!bw&&prev>0)e.sets.forEach(x=>{if(!(num(x.w)>0)&&num(x.r)>0){x.w=prev;fixed++}});
      const mx=e.sets.reduce((a,x)=>Math.max(a,num(x.w)),0);
      if(mx>0)byEx[e.exerciseId]=mx;
    });
  });
  state.settings.zeroFixDone=true;saveJ("settings",state.settings);
  if(fixed)saveJ("logs",state.logs);
  return fixed;
}

// Automatische Bereinigung: gleiche Namen zusammenführen, Karteileichen entfernen
function migrateDupes(){
  let changed=false;
  const count=id=>state.logs.reduce((a,l)=>a+l.entries.filter(e=>e.exerciseId===id).length,0);
  const byName={};
  state.library.forEach(e=>{const k=e.name.trim().toLowerCase();(byName[k]=byName[k]||[]).push(e)});
  Object.values(byName).forEach(group=>{
    if(group.length<2)return;
    const keep=group.slice().sort((a,b)=>count(b.id)-count(a.id))[0];
    group.filter(e=>e.id!==keep.id).forEach(dup=>{
      state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===dup.id){e.exerciseId=keep.id;e.name=keep.name}}));
      state.plans.forEach(p=>p.sessions.forEach(s=>{
        s.exercises.forEach(ex=>{if(ex.id===dup.id){ex.id=keep.id;ex.name=keep.name}});
        const seen=new Set();s.exercises=s.exercises.filter(ex=>seen.has(ex.id)?false:(seen.add(ex.id),true));}));
      state.library=state.library.filter(e=>e.id!==dup.id);changed=true;
    });
  });
  // Karteileichen: keine Logs, in keinem Plan
  const used=new Set(state.plans.flatMap(p=>p.sessions.flatMap(s=>s.exercises.map(e=>e.id))));
  const before=state.library.length;
  state.library=state.library.filter(e=>e.keep||used.has(e.id)||count(e.id)>0);
  if(state.library.length!==before)changed=true;
  if(changed){saveJ("logs",state.logs);saveJ("plans",state.plans);saveJ("library",state.library)}
  return changed;
}

const RANGES={all:"Gesamt",year:"Jahr",month:"Monat",week:"Woche",last:"Letzte"};
function rangeFilter(ls,r){
  if(r==="all"||!r)return ls;
  if(r==="last")return ls.slice(-1);
  const days={year:365,month:30,week:7}[r];
  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  return ls.filter(l=>l.date>=cut);
}
// Kraftverlauf über die Zeit: Ø-Zuwachs aller Übungen (gleiche Metrik wie growth)
// Kraft je Einheit: Ø-Zuwachs der in dieser Einheit trainierten Übungen ggü. ihrem ersten Wert
function sessionStrength(pl,allEx){
  pl=pl.filter(l=>!l.deload&&!l.altGym);const first={},useE={};
  allEx.forEach(ex=>{if(!(MUSCLE_MAP[ex.id]||{}).p)return;const ents=pl.map(l=>l.entries.find(x=>x.exerciseId===ex.id)).filter(Boolean);if(ents.length<2)return;
    const validE=ents.filter(e=>e.sets.some(s=>e1rm(s.w,s.r,s.rir)>0)).length;useE[ex.id]=validE>=Math.ceil(ents.length*0.6)});
  const val=(id,e)=>useE[id]?e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r,s.rir)),0):volLoad(e.sets);
  const out=[];pl.forEach(l=>{const a=[];l.entries.forEach(e=>{if(!(e.exerciseId in useE))return;const v=val(e.exerciseId,e);if(!(v>0))return;
    if(first[e.exerciseId]==null){first[e.exerciseId]=v;return}a.push((v/first[e.exerciseId]-1)*100)});
    if(a.length){a.sort((x,y)=>x-y);const m=a.length>>1;out.push({d:l.date,v:a.length%2?a[m]:(a[m-1]+a[m])/2})}});  // Median: einzelne Ausreißer-Übungen verzerren nicht
  return out;
}
// Kraftzuwachs im aktuellen Zyklus: je Übung Ø der letzten bis zu 3 Einheiten im Zyklus vs. Ø der letzten bis zu 3 Einheiten davor (ohne Deload/Wiedereinstieg/anderes Studio), Median über alle Übungen
function cycleGrowth(){const cs=state.settings.cycleStart;if(!cs)return null;
  const ls=state.logs.filter(l=>!l.deload&&!l.reentry&&!l.altGym).sort((a,b)=>a.date.localeCompare(b.date));
  const val=e=>{const v=e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r,s.rir)),0);return v>0?v:volLoad(e.sets)};
  const ids=new Set();ls.forEach(l=>l.entries.forEach(e=>{if((MUSCLE_MAP[e.exerciseId]||{}).p)ids.add(e.exerciseId)}));
  const out=[];ids.forEach(id=>{const pts=ls.map(l=>({d:l.date,e:l.entries.find(x=>x.exerciseId===id)})).filter(x=>x.e).map(x=>({d:x.d,v:val(x.e)})).filter(x=>x.v>0);
    const cur=pts.filter(x=>x.d>=cs).slice(-3),prev=pts.filter(x=>x.d<cs).slice(-3);if(!cur.length||!prev.length)return;
    const av=a=>a.reduce((s,x)=>s+x.v,0)/a.length;out.push((av(cur)/av(prev)-1)*100)});
  if(!out.length)return null;out.sort((a,b)=>a-b);const m=out.length>>1;return out.length%2?out[m]:(out[m-1]+out[m])/2}
function strengthSeries(pl,allEx){
  pl=pl.filter(l=>!l.deload&&!l.altGym);
  const per={};
  allEx.forEach(ex=>{if(!(MUSCLE_MAP[ex.id]||{}).p)return;const ents=pl.map(l=>({d:l.date,e:l.entries.find(x=>x.exerciseId===ex.id)})).filter(x=>x.e);if(ents.length<2)return;
    const validE=ents.filter(x=>x.e.sets.some(s=>e1rm(s.w,s.r,s.rir)>0)).length;const useE=validE>=Math.ceil(ents.length*0.6);
    per[ex.id]=ents.map(x=>({d:x.d,v:useE?x.e.sets.reduce((a,s)=>Math.max(a,e1rm(s.w,s.r,s.rir)),0):volLoad(x.e.sets)})).filter(x=>x.v>0)});
  const dates=[...new Set(pl.map(l=>l.date))].sort();const out=[];
  dates.forEach(d=>{let sum=0,n=0;Object.values(per).forEach(s=>{if(s.length<2||s[0].d>d)return;const last=s.filter(x=>x.d<=d).pop();sum+=(last.v/s[0].v-1)*100;n++});if(n)out.push({d,v:sum/n})});
  return out;
}

    +(state.backupText?'<textarea rows="4" readonly class="mono" style="font-size:11px" onclick="this.select();try{document.execCommand(\'copy\')}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(this.value)}catch(e){}">'+esc(state.backupText)+'</textarea>':'')
    +'<details><summary class="tiny">Backup wiederherstellen ▾</summary><p class="tiny" style="margin-top:6px">Backup-Text einfügen. Einheiten werden zusammengeführt (keine Duplikate).</p><textarea rows="3" id="imptext" class="mono" style="font-size:11px;margin-top:6px" placeholder=\'{"version":1,...}\'></textarea><button class="btn grn" style="margin-top:6px" onclick="impBackup()">Backup wiederherstellen</button></details></div></div>';

function growth(pl,allEx){
  const nDeload=pl.filter(l=>l.deload).length;
  pl=pl.filter(l=>!l.deload&&!l.altGym);
  const perEx=[];
  allEx.forEach(ex=>{
    const ents=pl.map(l=>l.entries.find(x=>x.exerciseId===ex.id)).filter(Boolean);
    if(!ents.length)return;
    // Metrik einmal festlegen: e1RM nur wenn in der Mehrheit der Einheiten gültig
    const validE=ents.filter(e=>e.sets.some(x=>e1rm(x.w,x.r,x.rir)>0)).length;
    const useE=validE>=Math.ceil(ents.length*0.6);
    const pts=ents.map(e=>{
      if(useE){const v=e.sets.reduce((a,x)=>Math.max(a,e1rm(x.w,x.r,x.rir)),0);return v>0?{v,unit:"e1RM"}:null}
      const vl=volLoad(e.sets);return vl>0?{v:Math.round(vl),unit:"Last×Wdh"}:null;
    }).filter(Boolean);
    const grp=(MUSCLE_MAP[ex.id]||{}).p;
    if(pts.length>=2&&grp){
      const first=pts[0].v,last=pts[pts.length-1].v;
      perEx.push({id:ex.id,name:ex.name,group:grp,first,last,unit:pts[pts.length-1].unit,pct:(last-first)/first*100,series:pts.map(x=>x.v)});
    }
  });
  const byG={};perEx.forEach(e=>{(byG[e.group]=byG[e.group]||[]).push(e.pct)});
  const groups=Object.entries(byG).map(([g,a])=>({g,v:Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10})).sort((a,b)=>b.v-a.v);
  return{perEx:perEx.sort((a,b)=>b.pct-a.pct),groups,overall:perEx.length?Math.round(perEx.reduce((a,e)=>a+e.pct,0)/perEx.length*10)/10:null,nDeload};
}

// ===== Trainingsabschluss =====
function sessionSummary(log,prs){
  const prev=state.logs.filter(l=>l.id!==log.id&&!l.deload&&l.sessionName===log.sessionName).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const sets=log.entries.reduce((a,e)=>a+e.sets.length,0);
  const ton=Math.round(log.entries.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+num(x.w)*num(x.r),0),0));
  const tm=calcTimes(log);
  let min=tm.brutto||log.durMin||null;
  const netto=tm.netto;
  const good=[],bad=[];
  // RIR-Disziplin
  let soll=0,tot=0;
  log.entries.forEach(e=>e.sets.forEach((x,i)=>{const rg=rirRange(e.scheme,i,e.sets.length);if(rg&&x.rir!=null){tot++;if(rirStatus(rg,x.rir)==="g")soll++}}));
  if(tot&&soll/tot>=0.8)good.push("RIR-Vorgabe zu "+Math.round(soll/tot*100)+" % eingehalten");
  else if(tot)bad.push("RIR-Vorgabe nur zu "+Math.round(soll/tot*100)+" % eingehalten");
  // Fortschritt je Übung
  log.entries.forEach(e=>{
    const pe=prev&&prev.entries.find(x=>x.exerciseId===e.exerciseId);
    if(!pe)return;
    const now=e.sets.reduce((a,x)=>Math.max(a,e1rm(x.w,x.r,x.rir)||num(x.w)*num(x.r)/10),0);
    const was=pe.sets.reduce((a,x)=>Math.max(a,e1rm(x.w,x.r,x.rir)||num(x.w)*num(x.r)/10),0);
    if(was>0&&now>was*1.02)good.push(e.name+" gesteigert");
    else if(was>0&&now<was*0.95){
      // Vorermüdung prüfen: hat eine frühere Übung derselben Einheit zugelegt oder mehr Sätze bekommen?
      const idx=log.entries.indexOf(e);
      const before=log.entries.slice(0,idx);
      const causer=before.find(x=>{
        if(x.mesoExtra)return true;
        const px=prev.entries.find(y=>y.exerciseId===x.exerciseId);if(!px)return false;
        const n2=x.sets.reduce((a,y)=>Math.max(a,e1rm(y.w,y.r,y.rir)||num(y.w)*num(y.r)/10),0);
        const w2=px.sets.reduce((a,y)=>Math.max(a,e1rm(y.w,y.r,y.rir)||num(y.w)*num(y.r)/10),0);
        return w2>0&&n2>w2*1.02;
      });
      const overRir=e.sets.length&&e.sets[0].rir===0&&/^[1-9]\//.test(e.scheme||"");
      if(overRir)bad.push(e.name+" schwächer — Satz 1 ging bis RIR0 statt RIR"+(e.scheme||"")[0]);
      else if(causer)bad.push(e.name+" schwächer — mögliche Vorermüdung durch "+causer.name);
      else bad.push(e.name+" schwächer als zuletzt");
    }
  });
  // Zielbereich
  log.entries.forEach(e=>{
    const m=(e.reps||"").match(/(\d+)\s*-\s*(\d+)/);if(!m)return;
    const lo=+m[1],hi=+m[2];
    const under=e.sets.filter(x=>num(x.r)<lo).length, over=e.sets.filter(x=>num(x.r)>hi).length;
    if(under>=Math.ceil(e.sets.length/2))bad.push(e.name+": unter Zielbereich — Gewicht senken");
    else if(over>=e.sets.length&&e.sets.length>1)good.push(e.name+": Zielbereich übertroffen — Gewicht erhöhen");
  });
  (prs||[]).forEach(n=>good.push("Bestwert: "+n));
  if(log.altGym)good.push("Anderes Studio — Werte fließen nicht in Progression und Statistik ein");
  const ci=log.checkin||{};
  if(ci.schlaf==="schlecht"||ci.essen==="wenig"||(ci.befinden!=null&&ci.befinden<=4))
    bad.push("Erholung/Ernährung war eingeschränkt — Leistung entsprechend einordnen");
  return{min,netto,sets,ton,good:good.slice(0,5),bad:bad.slice(0,5)};
}

// ================= Mesozyklus: Volumenprogression =================
const MESO_MAX_ADD=4;          // max. zusätzliche Sätze je Fokusmuskel im Zyklus
const MESO_TRAINABLE=["Brust","Rücken","Schulter","Quads","Hamstrings","Glutes/Hinge"];
// Fokus automatisch: die zwei Muskeln mit dem größten Rückstand zum Zielkorridor
function pickFocus(){
  const sw=(setsPerWeek(8)||{sets:{}}).sets;
  return MESO_TRAINABLE.map(g=>({g,v:sw[g]||0})).sort((a,b)=>a.v-b.v).slice(0,2).map(x=>x.g);

const MAX_SETS_PER_EX=4;   // ab dem 4. Satz je Übung sinkt der Grenznutzen stark
// Verteilt die Zusatzsätze reihum auf alle Übungen des Fokusmuskels (statt sie zu stapeln)
function mesoExtraFor(exId,add){
  if(!add)return 0;
  const mm=MUSCLE_MAP[exId];if(!mm)return 0;
  const cands=activePlan().sessions.flatMap(se=>se.exercises)
    // Zusatzsätze nur auf ermüdungsarme Übungen: keine schweren Hauptübungen (Pause ≥3 min), keine einseitigen Übungen
    .filter(x=>{const m=MUSCLE_MAP[x.id];return m&&m.p===mm.p&&!/Prehab|BW|Core|3s/i.test(x.scheme||"")&&(x.rest||0)<180&&!/einbeinig|einarmig/i.test(x.id+" "+x.name)})
    // Isolationsübungen zuerst, dann wenigste Sätze
    .sort((a,b)=>{const ia=!(MUSCLE_MAP[a.id].s||[]).length,ib=!(MUSCLE_MAP[b.id].s||[]).length;return (ib-ia)||a.sets-b.sets||a.id.localeCompare(b.id)});
  if(!cands.length)return 0;
  const alloc={};cands.forEach(x=>alloc[x.id]=0);
  let left=add,guard=0;
  while(left>0&&guard++<50){
    let placed=false;
    for(const x of cands){
      if(left<=0)break;
      if(x.sets+alloc[x.id]<MAX_SETS_PER_EX){alloc[x.id]++;left--;placed=true}
    }
    if(!placed)break;                       // alle Übungen am Limit
  }
  return alloc[exId]||0;
}
function mesoState(){
  let st=state.settings.meso;
  // Zyklusstart automatisch: nach Deload, nach längerer Pause, sonst ab Zyklusbeginn
  const lastDeload=[...state.logs].filter(l=>l.deload).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const autoStart=[state.settings.cycleStart||todayISO(),lastDeload?lastDeload.date:"",state.settings.mesoFloor||""].sort().pop();
  if(!st||st.start!==autoStart){
    st={start:autoStart,focus:pickFocus(),base:null};
    state.settings.meso=st;saveJ("settings",state.settings);
  }
  const wk=Math.max(0,Math.floor((Date.now()-new Date(st.start).getTime())/6048e5));
  let base=st.base;
  if(!base){
    base={};
    activePlan().sessions.forEach(se=>se.exercises.forEach(ex=>{const m=MUSCLE_MAP[ex.id];if(!m)return;
      base[m.p]=(base[m.p]||0)+ex.sets;(m.s||[]).forEach(g=>base[g]=(base[g]||0)+ex.sets*0.5)}));
    Object.keys(base).forEach(k=>base[k]=Math.round(base[k]*7/8*10)/10);
    st.base=base;state.settings.meso=st;saveJ("settings",state.settings);
  }
  const stop=sessionsSinceCycle()>=4&&(performanceDrop()>0||recoverySignals()>0);
  const add=stop?Math.max(0,Math.min(wk,MESO_MAX_ADD)-1):Math.min(wk,MESO_MAX_ADD);
  const target={};
  Object.keys(base).forEach(g=>{target[g]=Math.round((base[g]+(st.focus.includes(g)?add:0))*10)/10});
  return{week:wk+1,focus:st.focus,base,target,add,stop};
}
// ================= Wiedereinstieg nach Pause =================
// Kurze Pausen kosten kaum Kraft, aber Technik und Toleranz: erste Einheit reduziert

// Krankheit seit dem letzten Training: Tage krank (eingetragen im Kalender)
function sickSinceLast(){

// ================= Belastungssteuerung =================
// Wochen-Satzvolumen je Muskel (primär 1, sekundär 0,5), nur harte Sätze (RIR<=3)
function weeklySets(logs){
  const wk={};
  logs.filter(l=>!l.deload).forEach(l=>{
    const dt=new Date(l.date),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);
    wk[k]=wk[k]||{};

      const mm=MUSCLE_MAP[e.exerciseId];if(!mm)return;
      const hard=e.sets.filter(x=>x.r>0&&(x.rir==null||x.rir<=3)).length;
      if(!hard)return;
      wk[k][mm.p]=(wk[k][mm.p]||0)+hard;
      (mm.s||[]).forEach(g=>{wk[k][g]=(wk[k][g]||0)+hard*0.5});
    });
  });

// Normierte Wochensätze: letzte N Einheiten / tatsächlich vergangene Wochen
function setsPerWeek(nSessions){
  const ls=state.logs.filter(l=>!l.deload).sort((a,b)=>a.date.localeCompare(b.date)).slice(-(nSessions||8));
  if(ls.length<2)return null;
  // Zeitraum ohne Trainingspausen (Urlaub/Krankheit) — sonst verwässert die Dichte
  let days=RHYTHM;
  for(let i=1;i<ls.length;i++){
    const gap=(new Date(ls[i].date)-new Date(ls[i-1].date))/864e5;
    days+=gap>5?RHYTHM:gap;        // lange Lücken zählen wie ein normaler Abstand
  }
  const weeks=Math.max(1,days/7);
  const acc={};
  ls.forEach(l=>l.entries.forEach(e=>{
    const m=MUSCLE_MAP[e.exerciseId];if(!m)return;
    const hard=e.sets.filter(x=>num(x.r)>0&&(x.rir==null||x.rir<=3)).length;
    if(!hard)return;
    acc[m.p]=(acc[m.p]||0)+hard;(m.s||[]).forEach(g=>acc[g]=(acc[g]||0)+hard*0.5);
  }));
  Object.keys(acc).forEach(k=>acc[k]=Math.round(acc[k]/weeks*10)/10);
  return{sets:acc,weeks:Math.round(weeks*10)/10,n:ls.length};
}
// Belastungsindex: Sätze × Anstrengung (10−RIR); ACWR = aktuelle Woche / Ø 4 Wochen
// Belastung der letzten 7 Tage im Verhältnis zum Wochenschnitt der 4 Wochen davor (100 % = üblich)
function fatigueLoad(){const t=todayISO(),a7=addDays(t,-6),a35=addDays(t,-34);
  const ld=l=>{let v=0;l.entries.forEach(e=>e.sets.forEach(x=>{if(num(x.r)>0)v+=(10-(x.rir==null?1:Math.min(x.rir,5)))*(l.deload?0.6:1)}));return v};
  let cur=0,prev=0;state.logs.forEach(l=>{if(l.date>=a7&&l.date<=t)cur+=ld(l);else if(l.date>=a35&&l.date<a7)prev+=ld(l)});
  (state.acts||[]).forEach(x=>{if(x.date>=a7&&x.date<=t)cur+=actLoad(x);else if(x.date>=a35&&x.date<a7)prev+=actLoad(x)});
  const chronic=prev/4;if(!(chronic>0))return null;return{pct:Math.round(cur/chronic*100),cur:Math.round(cur),chronic:Math.round(chronic)}}
function loadIndex(){
  const wk={};
  state.logs.filter(l=>!l.deload).forEach(l=>{
    const dt=new Date(l.date),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);
    let v=0;l.entries.forEach(e=>e.sets.forEach(x=>{if(x.r>0)v+=(10-(x.rir==null?1:Math.min(x.rir,5)))}));
    wk[k]=(wk[k]||0)+Math.round(v);
  });
  (state.acts||[]).forEach(a=>{const dt=new Date(a.date),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);wk[k]=(wk[k]||0)+actLoad(a)});
  // nur abgeschlossene Wochen, fehlende Wochen (Urlaub) zählen als 0
  const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
  const thisWk=mon(todayISO());
  let ks=Object.keys(wk).filter(k=>k<thisWk).sort();
  if(ks.length<2)return null;
  const keys=[];for(let k=ks[0];k<thisWk;k=addDays(k,7)){keys.push(k);if(wk[k]==null)wk[k]=0}
  const cur=wk[keys[keys.length-1]];
  const prev=keys.slice(-5,-1).map(k=>wk[k]);
  const chronic=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:cur;
  return{cur,chronic:Math.round(chronic),acwr:Math.round(cur/(chronic||1)*100)/100,series:keys.map(k=>({d:k,v:wk[k]}))};
}

// Plan ab dem letzten Training erzeugen (vergangene Einträge fallen weg)
function buildSchedule(force){
  const t=todayISO();
  const all=state.settings.schedule||[];
  let sc=all.filter(x=>x.date>=t);
  const ls=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date));
  const lastLog=ls[ls.length-1];
  // Verpasster Termin (vergangen, kein Training danach) oder falsche Reihenfolge → ab letztem Training neu planen
  const missed=all.some(x=>x.date<t&&(!lastLog||x.date>lastLog.date));
  const nxt=nextSessionId(lastLog?lastLog.sessionId:null,lastLog?lastLog.sessionName:null);
  if(missed||(sc.length&&sc[0].sessionId!==nxt))force=true;
  // Startpunkt: nach letztem geplanten Eintrag, sonst nach letztem Training
  if(force||!sc.length){
    let d=lastLog?addDays(lastLog.date,RHYTHM):t;
    if(d<t)d=t;
    let sid=nextSessionId(lastLog?lastLog.sessionId:null,lastLog?lastLog.sessionName:null);
    sc=[];
    for(let i=0;i<12;i++){
      while(isAbsent(d))d=addDays(d,1);
      sc.push({date:d,sessionId:sid});
      d=addDays(d,RHYTHM);sid=nextSessionId(sid);
    }
  }else if(sc.length<12){
    let d=addDays(sc[sc.length-1].date,RHYTHM),sid=nextSessionId(sc[sc.length-1].sessionId);
    while(sc.length<12){while(isAbsent(d))d=addDays(d,1);sc.push({date:d,sessionId:sid});d=addDays(d,RHYTHM);sid=nextSessionId(sid)}
  }
  state.settings.schedule=sc;saveJ("settings",state.settings);
  return sc;
}
// Einheit verschieben: Folgetermine rücken nach
function moveSession(fromIso,toIso){
  const sc=buildSchedule();
  const i=sc.findIndex(x=>x.date===fromIso);
  if(i<0)return;
  let d=toIso,sid=sc[i].sessionId;
  const rest=[];
  for(let k=i;k<sc.length;k++){
    while(isAbsent(d))d=addDays(d,1);
    rest.push({date:d,sessionId:sid});
    d=addDays(d,RHYTHM);sid=nextSessionId(sid);
  }
  state.settings.schedule=[...sc.slice(0,i).filter(x=>x.date<toIso),...rest].sort((a,b)=>a.date.localeCompare(b.date));
  saveJ("settings",state.settings);
  autoPlanDeload();
  state.moveFrom=null;render();toast("Verschoben auf "+fmtD(toIso)+" — Folgetermine angepasst");
}

// Deload-Planung nach Trainingslehre: Last-basiert, nicht kalenderbasiert
const ABS_RESET_DAYS=5;      // ab dieser Pausenlänge zählt sie als vollwertige Entlastung
function recoverySignals(){
  const cut=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  const from=[state.settings.cycleStart||"",cut].sort().pop();      // späteres Datum gewinnt
  const r=[...state.logs].filter(l=>!l.deload&&l.date>=from).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  const bad=r.filter(l=>l.checkin&&((l.checkin.befinden!=null&&l.checkin.befinden<=4)||l.checkin.gefuehl==="schwach"||l.checkin.schlaf==="schlecht")).length;
  return r.length>=3&&bad>=2?bad:0;
}
// Zyklusstart reparieren: nur Deload, lange Pause oder manueller Neustart dürfen ihn setzen (Planwechsel nicht)
function repairCycle(){
  const t=todayISO(),c=[];
  const ld=[...state.logs].filter(l=>l.deload).sort((a,b)=>b.date.localeCompare(a.date))[0];if(ld)c.push(ld.date);
  (state.settings.absences||[]).forEach(a=>{if((new Date(a.to)-new Date(a.from))/864e5+1>=ABS_RESET_DAYS&&a.to<t)c.push(a.to)});
  if(state.settings.cycleManual)c.push(state.settings.cycleManual);
  if(!c.length)return false;
  const ok=c.sort().pop(),cs=state.settings.cycleStart||"";
  if(cs<=ok)return false;
  // Mesozyklus nicht sprunghaft erhöhen: bisheriger Start bleibt Untergrenze
  if(!state.settings.mesoFloor)state.settings.mesoFloor=(state.settings.meso&&state.settings.meso.start)||cs;
  state.settings.cycleStart=ok;saveJ("settings",state.settings);return true;
}
// Nach zurückliegender längerer Pause: Zyklus zurücksetzen (Pause = Deload)
function absenceReset(){
  const t=todayISO();let changed=false;
  (state.settings.absences||[]).forEach(a=>{
    const days=(new Date(a.to)-new Date(a.from))/864e5+1;
    if(days>=ABS_RESET_DAYS&&a.to<t&&a.to>state.settings.cycleStart){state.settings.cycleStart=a.to;changed=true}
  });
  if(changed){saveJ("settings",state.settings);return true}
  return false;
}

   if(pd&&pd<todayISO()&&!deloadDue()&&!(sessionsSinceCycle()>=4&&(performanceDrop()>0||recoverySignals()>0)))delete state.settings.plannedDeload;}
  const t0=todayISO(),pd0=state.settings.plannedDeload;
  // Termin erreicht/überfällig und noch kein Deload geloggt → stehen lassen
  if(pd0&&pd0<=t0&&!state.logs.some(l=>l.deload&&l.date>=pd0)&&!isAbsent(t0))return null;   // fällig → stehen lassen (außer heute krank/abwesend)
  const rest=Math.max(DELOAD_AFTER-sessionsSinceCycle(),0);
  const sc=state.settings.schedule||[];
  let d;
  if(sc.length&&rest>0&&rest<=sc.length){d=new Date(sc[rest-1].date)}      // Termin aus Trainingsplan
  else{const ls=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date));
    const base=ls.length?new Date(ls[ls.length-1].date):new Date();
    d=new Date(base.getTime()+Math.max(rest,1)*RHYTHM*864e5)}   // ~jeden 2. Tag
  // Signale ziehen den Termin vor
  if(sessionsSinceCycle()>=4&&(performanceDrop()||recoverySignals()))d=new Date(Date.now()+2*864e5);
  // Geplante Pause vor dem Termin: lange Pause ersetzt Deload → danach voller Zyklus
  const abs=(state.settings.absences||[]).filter(a=>a.to>=todayISO()).sort((x,y)=>x.from.localeCompare(y.from));
  abs.forEach(a=>{
    const days=(new Date(a.to)-new Date(a.from))/864e5+1;
    const dIso=d.toISOString().slice(0,10);
    const vorlauf=(new Date(a.from)-d)/864e5;
    if(dIso>=a.from){
      d=days>=ABS_RESET_DAYS
        ? new Date(new Date(a.to).getTime()+DELOAD_AFTER*2*864e5)   // neuer voller Zyklus
        : new Date(d.getTime()+days*864e5);                          // nur um Pausendauer schieben
    }else if(days>=ABS_RESET_DAYS&&vorlauf<=14){                     // Pause steht kurz bevor → ersetzt Deload
      d=new Date(new Date(a.to).getTime()+DELOAD_AFTER*2*864e5);
    }
  });
  let iso=d.toISOString().slice(0,10);
  // Nach Krankheit vorgezogen: erster geplanter Termin ab Gesundung
  {const de=state.settings.deloadEarly;
   if(de&&de>state.settings.cycleStart&&!state.logs.some(l=>l.deload&&l.date>=de)){
     const first=(state.settings.schedule||[]).find(x=>x.date>=de);const e=first?first.date:de;if(e<iso)iso=e}
   else if(de)delete state.settings.deloadEarly}
  if(state.settings.plannedDeload!==iso){state.settings.plannedDeload=iso;saveJ("settings",state.settings);return iso}
  return null;
}

try{document.getElementById("favicon").href=document.getElementById("touchicon").href}catch(e){}
boot();
try{const ms=Math.round(performance.now());const bt=JSON.parse(localStorage.getItem("tl_boot")||"[]");bt.push({d:new Date().toISOString().slice(0,16),ms,sw:!!(navigator.serviceWorker&&navigator.serviceWorker.controller)});localStorage.setItem("tl_boot",JSON.stringify(bt.slice(-10)))}catch(e){}
// Auto-Update: neue Version auf GitHub erkennen und laden (iOS-Homescreen hält sonst die alte Datei im Cache)
function checkUpdate(){
  if(state.active||!navigator.onLine||location.protocol==="file:")return;
  const base=location.pathname.replace(/[^/]*$/,"");
  fetch(base+"version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():Promise.reject()).catch(()=>fetch(location.pathname+"?nocache="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"")).then(t=>{
    const m=String(t||"").match(/APP_VERSION="v(\d+)"/)||String(t||"").match(/"version":"v(\d+)"/);if(!m)return;
    const cur=+APP_VERSION.slice(1),neu=+m[1];
    if(neu>cur){let tried={};try{tried=JSON.parse(localStorage.getItem("tl_updTry")||"{}")}catch(e){}
      if(tried.v===neu&&Date.now()-tried.t<10*60000)return;          // gleiche Version schon versucht (CDN noch alt) → nicht erneut laden
      try{localStorage.setItem("tl_updTry",JSON.stringify({v:neu,t:Date.now()}))}catch(e){}
      toast("Update auf v"+neu+" …");
      const go=()=>location.replace(location.pathname);
      if(window.caches)fetch(location.pathname+"?nocache="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.clone().text().then(t=>{if(!/APP_VERSION="v/.test(t))throw 0;return caches.open("tl-app").then(c=>c.put("./",r))}):0).then(go,go);
      else go()}
  }).catch(()=>{});
}
setTimeout(checkUpdate,300);
if(location.search)try{history.replaceState(null,"",location.pathname)}catch(e){}   // ?v=… entfernen, damit der nächste Start aus dem Cache kommt
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
