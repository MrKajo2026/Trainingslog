<meta name="apple-mobile-web-app-title" content="Trainingslog">
<title>Trainingslog</title>
<style>
:root{--bg:#0c0c0e;--s1:#18181b;--s2:#27272a;--s3:#3f3f46;--tx:#f4f4f5;--mut:#71717a;--dim:#52525b;--red:#dc2626;--red2:#ef4444;--grn:#34d399;--grn2:#10b981;--amb:#f59e0b;--sky:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,sans-serif;font-size:15px;padding-bottom:86px;min-height:100vh}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--s2);padding:16px 16px 10px;z-index:10}
header h1{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;display:inline}
#hinfo{float:right;font-size:11px;color:var(--mut)}
main{padding:16px;display:flex;flex-direction:column;gap:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s1);border-top:1px solid var(--s2);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;padding:17px 2px;background:none;border:none;color:var(--mut);font-size:clamp(9px,2.7vw,12px);font-weight:700;text-transform:uppercase;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button.on{color:var(--red2);border-top:2px solid var(--red2);margin-top:-1px}
.card{background:var(--s1);border:1px solid var(--s2);border-radius:14px;padding:14px}
.card.hl{background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.45)}
.card.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.4)}
.card.ok{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.35)}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:800;font-size:14px}
.btn.red{background:var(--red);color:#fff}.btn.dim{background:var(--s2);color:var(--mut)}.btn.grn{background:var(--grn2);color:#fff}.btn.amb{background:var(--amb);color:#111}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
.small{font-size:12px;color:var(--mut)}.tiny{font-size:11px;color:var(--dim)}
.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.chip{padding:6px 10px;border-radius:8px;border:none;background:var(--s2);color:var(--mut);font-size:12px;font-weight:700}
.chip.on-g{background:var(--grn2);color:#fff}.chip.on-n{background:var(--s3);color:#fff}.chip.on-r{background:var(--red);color:#fff}.chip.on-a{background:var(--amb);color:#111}
input[type=text],textarea,select{background:var(--s2);border:1px solid var(--s3);border-radius:9px;color:var(--tx);padding:9px 10px;font-size:14px;width:100%;font-family:inherit;-webkit-appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--red2)}
.win{width:100%;text-align:center;font-size:15px;padding:9px 2px}.winr{width:100%;text-align:center;font-size:15px;padding:9px 2px}
.setrow{display:flex;align-items:center;gap:4px;background:rgba(63,63,70,.22);border-radius:10px;padding:5px 6px}
.rir{width:26px;height:30px;border-radius:6px;font-size:11px}
.rir{width:33px;height:33px;border-radius:8px;border:none;background:var(--s2);color:var(--dim);font-weight:800;font-size:12px}
.rir.g{background:var(--grn);color:#052}.rir.y{background:var(--amb);color:#210}.rir.r{background:var(--red);color:#fff}.rir.d{background:var(--s3);color:#fff}
.exname{font-weight:700;font-size:14px}
.rec{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--grn);border-radius:8px;padding:6px 9px;font-size:12px;margin:6px 0}
.note-a{color:rgba(245,158,11,.85);font-size:12px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.hrow{display:flex;justify-content:space-between;padding:10px 0 4px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat3 .card{text-align:center;padding:12px 6px}
.stat3 b{font-size:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--s1);border-top:1px solid var(--s3);border-radius:18px 18px 0 0;padding:16px;max-height:70vh;overflow-y:auto}
.libitem{display:block;width:100%;text-align:left;background:var(--s2);border:1px solid var(--s3);border-radius:9px;padding:10px;margin-top:6px;color:var(--tx);font-size:13px}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--grn2);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.swap{color:var(--sky);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);border-radius:7px;padding:3px 9px;font-size:13px;font-weight:800}
svg text{font-family:ui-monospace,Menlo,monospace}
input[type=range]{width:100%;accent-color:var(--red2)}
.hline{border-bottom:1px solid var(--s2);padding:5px 0;display:flex;justify-content:space-between;font-size:12px}
.hline:last-child{border:none}
h2{font-size:20px;font-weight:900;letter-spacing:-.02em}
.del{color:var(--red2);background:var(--s2);border:none;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:700}
.del.sure{background:var(--red);color:#fff}

html,body{width:100%;max-width:100%;overflow-x:hidden}
main,.card,.setrow{width:100%;max-width:100%;min-width:0}
.row{flex-wrap:wrap;min-width:0}
.row>*{min-width:0}
header h1{font-size:clamp(15px,4.5vw,18px)}
#hinfo{float:none;display:block;font-size:clamp(9px,2.6vw,11px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:clamp(16px,5vw,20px)}
.chip{white-space:nowrap}
.exname{word-break:break-word}
@media (max-width:340px){
 body{font-size:14px}
 .rir{width:30px;height:30px}
 .win,.winr{font-size:15px;padding:9px 4px}
 nav button{font-size:10px;padding:15px 1px}
}
</style>

      else if(rec3.length>=3&&bad>=2)bn='<div '+SKY+'>ℹ️ Erholungssignale ('+bad+'/3) — Deload erwägen</div>';
      else if(calibrationDue())bn='<button '+SKY+' onclick="markCalibrated()">ℹ️ RIR-Kalibrierung fällig — 1 Iso-Satz bis echtes Versagen · erledigt ›</button>';
      else if(daysSinceLast()>=8&&sessionsSinceCycle()>=8)bn='<button '+SKY+' onclick="pauseAsDeload()">ℹ️ '+daysSinceLast()+' Tage Pause — als Deload werten ›</button>';
    }
  }
  $("hbanner").innerHTML=bn;
  $("nav").innerHTML=[["training","Training"],["statistik","Statistik"],["kalender","Kalender"],["plaene","Pläne"]].map(([id,l])=>'<button class="'+(state.tab===id?"on":"")+'" onclick="go(\''+id+'\')">'+l+'</button>').join("");
  const m=$("main");
  if(state.tab==="training")m.innerHTML=state.active?vLogger():vHome();

  else if(state.tab==="plaene")m.innerHTML=vPlans();
  else if(state.tab==="statistik")m.innerHTML=vStats();
  else if(state.tab==="deload")m.innerHTML=vDeload();
  if(state.tab==="statistik")drawCharts();
  if(state.tab==="kalender")calSwipe();
  initSwipe();
  updUndoBtn();
}
const TABS=["training","statistik","kalender","plaene"];
function initSwipe(){
  if(window.__swipeOn)return;window.__swipeOn=true;
  let x0=null,y0=null;
  document.addEventListener("touchstart",e=>{const el=e.target.closest("#calgrid,input,textarea,select,.sheet");if(el){x0=null;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  document.addEventListener("touchend",e=>{if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){
      if(state.active)return;                       // nicht während laufender Einheit
      const i=TABS.indexOf(state.tab);if(i<0)return;
      const n=dx<0?i+1:i-1;if(n>=0&&n<TABS.length)go(TABS[n]);
    }
    x0=null},{passive:true});
}

// Automatische Bereinigung: gleiche Namen zusammenführen, Karteileichen entfernen
function migrateDupes(){
  let changed=false;
  const count=id=>state.logs.reduce((a,l)=>a+l.entries.filter(e=>e.exerciseId===id).length,0);
  const byName={};
  state.library.forEach(e=>{const k=e.name.trim().toLowerCase();(byName[k]=byName[k]||[]).push(e)});
  Object.values(byName).forEach(group=>{
    if(group.length<2)return;
    const keep=group.slice().sort((a,b)=>count(b.id)-count(a.id))[0];
    group.filter(e=>e.id!==keep.id).forEach(dup=>{
      state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===dup.id){e.exerciseId=keep.id;e.name=keep.name}}));
      state.plans.forEach(p=>p.sessions.forEach(s=>{
        s.exercises.forEach(ex=>{if(ex.id===dup.id){ex.id=keep.id;ex.name=keep.name}});
        const seen=new Set();s.exercises=s.exercises.filter(ex=>seen.has(ex.id)?false:(seen.add(ex.id),true));}));
      state.library=state.library.filter(e=>e.id!==dup.id);changed=true;
    });
  });
  // Karteileichen: keine Logs, in keinem Plan
  const used=new Set(state.plans.flatMap(p=>p.sessions.flatMap(s=>s.exercises.map(e=>e.id))));
  const before=state.library.length;
  state.library=state.library.filter(e=>used.has(e.id)||count(e.id)>0);
  if(state.library.length!==before)changed=true;
  if(changed){saveJ("logs",state.logs);saveJ("plans",state.plans);saveJ("library",state.library)}
  return changed;
}
function startMerge(id){state.mergeFrom=state.mergeFrom===id?null:id;state.renameId=null;render()}
function doRename(id){
  const inp=$("rn-"+id);const n=(inp?inp.value:"").trim();
  if(!n){toast("Name darf nicht leer sein");return}
  if(state.library.some(e=>e.id!==id&&e.name.trim().toLowerCase()===n.toLowerCase())){toast("Name existiert bereits — stattdessen zusammenführen (⇄)");return}
  const lib=state.library.find(e=>e.id===id);if(lib)lib.name=n;
  state.plans.forEach(p=>p.sessions.forEach(s=>s.exercises.forEach(ex=>{if(ex.id===id)ex.name=n})));
  state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===id)e.name=n}));
  saveJ("library",state.library);saveJ("plans",state.plans);saveJ("logs",state.logs);
  state.renameId=null;render();toast("Umbenannt — alle Daten erhalten ✓")}
function doMerge(toId){
  const from=state.mergeFrom,fromEx=state.library.find(e=>e.id===from),toEx=state.library.find(e=>e.id===toId);
  if(!from||from===toId||!toEx){state.mergeFrom=null;render();return}
  let n=0;
  state.logs.forEach(l=>l.entries.forEach(e=>{if(e.exerciseId===from){e.exerciseId=toId;e.name=toEx.name;n++}}));
  state.plans.forEach(p=>p.sessions.forEach(s=>{s.exercises=s.exercises.filter((ex,i,arr)=>
    !(ex.id===from&&arr.some(o=>o.id===toId)));s.exercises.forEach(ex=>{if(ex.id===from){ex.id=toId;ex.name=toEx.name}})}));
  state.library=state.library.filter(e=>e.id!==from);
  saveJ("logs",state.logs);saveJ("plans",state.plans);saveJ("library",state.library);
  state.mergeFrom=null;render();toast(n+" Einträge übertragen: "+fromEx.name+" → "+toEx.name)}

function rangeFilter(ls,r){
  if(r==="all"||!r)return ls;

  const cut=new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  return ls.filter(l=>l.date>=cut);

     +'<p class="tiny">Aktuelle Woche '+li.cur+' vs. Ø letzte 4 Wochen '+li.chronic+' — '+st.t+'.</p>'
     +'<p class="tiny" style="margin-top:4px">Sätze × Anstrengung (10−RIR). Sprünge über 1,5 gehen Verletzungen und Übermüdung voraus.</p></div>';
  }
  // Kraft vs. Körpergewicht
  const gAll=growth(pl,allEx);

  if(gAll.overall!==null&&wsAll.length>=2){

    if(dkg>0.8&&gAll.overall<1){msg="Gewicht steigt, Kraft kaum — Überschuss zu hoch, Kalorien zurücknehmen.";col="var(--amb)"}

    else if(dkg<-0.3&&gAll.overall>=0){msg="Gewicht fällt, Kraft hält — im Aufbau zu wenig gegessen.";col="var(--amb)"}
    else if(dkg<-0.3&&gAll.overall<0){msg="Gewicht und Kraft fallen — klares Kaloriendefizit.";col="var(--red2)"}

    h+='<div class="card"><span class="lbl">Kraft &amp; Körpergewicht</span><p class="tiny" style="margin-top:4px">Gewicht <b class="mono">'+(dkg>0?"+":"")+dkg.toFixed(1).replace(".",",")+' kg</b> · Kraft <b class="mono">'+(gAll.overall>0?"+":"")+gAll.overall+'%</b></p><p class="tiny" style="color:'+col+';margin-top:4px">'+msg+'</p></div>';

   +['woche'].concat(p.sessions.map(x=>x.id)).map(k=>{const lbl=k==="woche"?"Woche":(p.sessions.find(x=>x.id===k)||{}).name;
       return '<button class="chip'+(tmode===k?" on-n":"")+'" style="flex:1;padding:6px 2px;font-size:11px" onclick="state.tonMode=\''+k+'\';render()">'+esc(lbl)+'</button>'}).join("")
   +'</div><div id="tchart"></div></div>';

  h+='<details class="card" style="padding:0"><summary style="padding:12px 14px" class="row"><span style="flex:1;font-weight:700;font-size:14px">Daten-Backup</span><span class="tiny">▼</span></summary><div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:10px">'
  +'<div><p class="lbl" style="margin-bottom:4px">Sichern</p><p class="tiny" style="margin-bottom:6px">Backup kopieren und im Claude-Chat oder einer Notiz ablegen. Der Chat-Trainer kann daraus auch die Analyse machen.</p>'
  +'<div class="row"><button class="chip" style="flex:1;padding:10px" onclick="mkBackup()">Backup erzeugen</button><button class="chip" style="padding:10px" onclick="dlBackup()">⬇ Datei</button></div>'
  +(state.backupText?'<textarea rows="4" readonly class="mono" style="font-size:11px;margin-top:6px" onclick="this.select();try{document.execCommand(\'copy\')}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(this.value)}catch(e){}">'+esc(state.backupText)+'</textarea><p class="tiny" style="color:var(--grn);margin-top:3px">Antippen = markiert & kopiert.</p>':'')
  +'</div><div style="border-top:1px solid var(--s2);padding-top:10px"><p class="lbl" style="margin-bottom:4px">Wiederherstellen</p><p class="tiny" style="margin-bottom:6px">Backup-Text einfügen. Einheiten werden zusammengeführt (keine Duplikate).</p>'
  +'<textarea rows="3" id="imptext" class="mono" style="font-size:11px" placeholder=\'{"version":1,...}\'></textarea>'
  +'<button class="btn grn" style="margin-top:6px" onclick="impBackup()">Backup wiederherstellen</button></div></div></details>';
  return h;
}
function growth(pl,allEx){
  const nDeload=pl.filter(l=>l.deload).length;
  pl=pl.filter(l=>!l.deload);
  const perEx=[];
  allEx.forEach(ex=>{
    const ents=pl.map(l=>l.entries.find(x=>x.exerciseId===ex.id)).filter(Boolean);
    if(!ents.length)return;
    // Metrik einmal festlegen: e1RM nur wenn in der Mehrheit der Einheiten gültig
    const validE=ents.filter(e=>e.sets.some(x=>e1rm(x.w,x.r,x.rir)>0)).length;
    const useE=validE>=Math.ceil(ents.length*0.6);
    const pts=ents.map(e=>{
      if(useE){const v=e.sets.reduce((a,x)=>Math.max(a,e1rm(x.w,x.r,x.rir)),0);return v>0?{v,unit:"e1RM"}:null}
      const vl=volLoad(e.sets);return vl>0?{v:Math.round(vl),unit:"Last×Wdh"}:null;
    }).filter(Boolean);
    const grp=(MUSCLE_MAP[ex.id]||{}).p;
    if(pts.length>=2&&grp){
      const first=pts[0].v,last=pts[pts.length-1].v;
      perEx.push({name:ex.name,group:grp,first,last,unit:pts[pts.length-1].unit,pct:(last-first)/first*100});
    }
  });
  const byG={};perEx.forEach(e=>{(byG[e.group]=byG[e.group]||[]).push(e.pct)});
  const groups=Object.entries(byG).map(([g,a])=>({g,v:Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10})).sort((a,b)=>b.v-a.v);
  return{perEx:perEx.sort((a,b)=>b.pct-a.pct),groups,overall:perEx.length?Math.round(perEx.reduce((a,e)=>a+e.pct,0)/perEx.length*10)/10:null,nDeload};
}

      +'<text x="'+(100+Math.max(bw,2))+'" y="'+(y+15)+'" fill="#71717a" font-size="10">'+(x.v>0?"+":"")+x.v+'%</text>'});

      const ev=e.sets.reduce((a,x)=>Math.max(a,e1rm(x.w,x.r,x.rir)),0);

    else{

      const X=i=>P+i/(data.length-1)*(W-P-8);const Y=v=>H-18-(v-mn)/(mx-mn||1)*(H-34);
      const line=(key,col)=>'<polyline fill="none" stroke="'+col+'" stroke-width="2" points="'+data.map((x,i)=>X(i)+','+Y(x[key])).join(" ")+'"/>'
        +data.map((x,i)=>'<circle cx="'+X(i)+'" cy="'+Y(x[key])+'" r="2.5" fill="'+col+'"/>').join("");
      let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
      [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f;svg+='<line x1="'+P+'" y1="'+Y(v)+'" x2="'+W+'" y2="'+Y(v)+'" stroke="#27272a" stroke-dasharray="3 3"/><text x="0" y="'+(Y(v)+3)+'" fill="#52525b" font-size="9">'+Math.round(v)+'</text>'});
      svg+=line("w","#38bdf8")+line("e","#ef4444");
      data.forEach((x,i)=>{if(data.length<=8||i%2===0||i===data.length-1)svg+='<text x="'+X(i)+'" y="'+(H-4)+'" fill="#52525b" font-size="8" text-anchor="middle">'+x.d+'</text>'});
      svg+='<text x="'+P+'" y="10" fill="#ef4444" font-size="9">— e1RM</text><text x="'+(P+55)+'" y="10" fill="#38bdf8" font-size="9">— Top-Gewicht</text>';
      const d=data[data.length-1].e-data[data.length-2].e;
      ec.innerHTML=svg+'</svg><p class="tiny mono" style="text-align:right;color:'+(d>0?"var(--grn)":d<0?"var(--red2)":"var(--mut)")+'">'+(d>0?"▲ +":d<0?"▼ ":"→ ")+Math.abs(d).toFixed(1)+' e1RM zur Voreinheit</p>';
    }
  }
  // Koerpergewicht-Chart
  const wc=$("wchart");
  if(wc){
    const ws=rangeFilter((state.weights||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)),state.statRange||"all");
    if(ws.length>=2){
      const W=320,H=150,P=30;
      const vals=ws.map(x=>x.kg);const mn=Math.min(...vals)-.6,mx=Math.max(...vals)+.6;
      const X=i=>P+i/(ws.length-1)*(W-P-8), Y=v=>H-18-(v-mn)/(mx-mn||1)*(H-34);
      let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
      [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f;svg+='<line x1="'+P+'" y1="'+Y(v)+'" x2="'+W+'" y2="'+Y(v)+'" stroke="#27272a" stroke-dasharray="3 3"/><text x="0" y="'+(Y(v)+3)+'" fill="#52525b" font-size="9">'+v.toFixed(1)+'</text>'});
      svg+='<polyline fill="none" stroke="#38bdf8" stroke-width="2" points="'+ws.map((x,i)=>X(i)+","+Y(x.kg)).join(" ")+'"/>';
      svg+=ws.map((x,i)=>'<circle cx="'+X(i)+'" cy="'+Y(x.kg)+'" r="2.5" fill="#38bdf8"/>').join("");
      ws.forEach((x,i)=>{if(ws.length<=8||i%Math.ceil(ws.length/6)===0||i===ws.length-1)svg+='<text x="'+X(i)+'" y="'+(H-4)+'" fill="#52525b" font-size="8" text-anchor="middle">'+fmtD(x.date)+'</text>'});
      wc.innerHTML=svg+'</svg>';
    }
  }
  // Tonnage-Balken: Woche oder Einheitstyp
  const tc=$("tchart");
  if(tc){

    let data=[];
    if(tmode==="woche"){
      const m={};
      pl.forEach(l=>{const dt=new Date(l.date);const on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
        const k=on.toISOString().slice(0,10);m[k]=(m[k]||0)+ton(l)});
      data=Object.keys(m).sort().map(k=>({d:"KW "+fmtD(k),v:m[k]}));
    }else{
      data=pl.filter(l=>l.sessionId===tmode).map(l=>({d:fmtD(l.date),v:ton(l)}));
    }
    if(data.length<1){tc.innerHTML='<p class="tiny" style="text-align:center;padding:12px">Keine Daten im Zeitraum.</p>'}
    else{
      const W=320,H=150;const mx=Math.max(...data.map(t=>t.v),1);const bw=Math.min(34,(W-20)/data.length-4);
      let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%">';
      data.forEach((t,i)=>{const x=10+i*((W-20)/data.length);const bh=t.v/mx*(H-42);
        svg+='<rect x="'+x+'" y="'+(H-20-bh)+'" width="'+bw+'" height="'+bh+'" rx="3" fill="#ef4444"/>'
        +'<text x="'+(x+bw/2)+'" y="'+(H-24-bh)+'" fill="#a1a1aa" font-size="8" text-anchor="middle">'+(t.v>=1000?(t.v/1000).toFixed(1).replace(".",",")+"t":t.v)+'</text>'
        +(data.length<=9?'<text x="'+(x+bw/2)+'" y="'+(H-5)+'" fill="#52525b" font-size="7.5" text-anchor="middle">'+t.d+'</text>':'')});
      const avg=Math.round(data.reduce((a,t)=>a+t.v,0)/data.length);
      tc.innerHTML=svg+'</svg><p class="tiny" style="text-align:right">Ø '+(avg>=1000?(avg/1000).toFixed(1).replace(".",",")+" t":avg+" kg")+' je '+(tmode==="woche"?"Woche":"Einheit")+'</p>';
    }
  }
}

// ================= Andere Sportarten =================
const ACT_TYPES={rad:{n:"Rad",i:"🚴",f:.6},lauf:{n:"Laufen",i:"🏃",f:1.0},schwimm:{n:"Schwimmen",i:"🏊",f:.7},paddel:{n:"Paddeln",i:"🛶",f:.7},sonst:{n:"Sonstiges",i:"⚡",f:.8}};
// Belastungspunkte: Minuten × RPE × Sportart-Faktor / 6  (grob vergleichbar mit Satz-Anstrengung)
const actLoad=a=>Math.round((a.min||0)*(a.rpe||5)*((ACT_TYPES[a.type]||{}).f||.8)/6);
// Warnung: harte Ausdauer kurz vor Beintag
function interferenceWarn(sessionId){
  if(!/uk/i.test(sessionId||""))return null;
  const t=Date.now();
  const recent=(state.acts||[]).filter(a=>{const d=(t-new Date(a.date).getTime())/864e5;return d>=0&&d<1.5});
  const hard=recent.find(a=>(a.min>=75)||(a.rpe>=7));
  if(!hard)return null;
  return (ACT_TYPES[hard.type]||{}).n+" am "+fmtD(hard.date)+" ("+hard.min+"min, RPE "+hard.rpe+") — Beine vorermüdet, Gewichte ggf. anpassen";
}
// ================= Belastungssteuerung =================
// Wochen-Satzvolumen je Muskel (primär 1, sekundär 0,5), nur harte Sätze (RIR<=3)
function weeklySets(logs){
  const wk={};
  logs.filter(l=>!l.deload).forEach(l=>{
    const dt=new Date(l.date),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);
    wk[k]=wk[k]||{};
    l.entries.forEach(e=>{
      const mm=MUSCLE_MAP[e.exerciseId];if(!mm)return;
      const hard=e.sets.filter(x=>x.r>0&&(x.rir==null||x.rir<=3)).length;
      if(!hard)return;
      wk[k][mm.p]=(wk[k][mm.p]||0)+hard;
      (mm.s||[]).forEach(g=>{wk[k][g]=(wk[k][g]||0)+hard*0.5});
    });
  });
  return wk;
}
// Belastungsindex: Sätze × Anstrengung (10−RIR); ACWR = aktuelle Woche / Ø 4 Wochen
function loadIndex(){
  const wk={};
  state.logs.filter(l=>!l.deload).forEach(l=>{
    const dt=new Date(l.date),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);
    let v=0;l.entries.forEach(e=>e.sets.forEach(x=>{if(x.r>0)v+=(10-(x.rir==null?1:Math.min(x.rir,5)))}));
    wk[k]=(wk[k]||0)+Math.round(v);
  });
  (state.acts||[]).forEach(a=>{const dt=new Date(a.date),on=new Date(dt);on.setDate(dt.getDate()-((dt.getDay()+6)%7));
    const k=on.toISOString().slice(0,10);wk[k]=(wk[k]||0)+actLoad(a)});
  const keys=Object.keys(wk).sort();
  if(keys.length<2)return null;
  const cur=wk[keys[keys.length-1]];
  const prev=keys.slice(-5,-1).map(k=>wk[k]);
  const chronic=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:cur;
  return{cur,chronic:Math.round(chronic),acwr:Math.round(cur/(chronic||1)*100)/100,series:keys.map(k=>({d:k,v:wk[k]}))};
}

const RHYTHM=2; // Tage zwischen Einheiten
const isAbsent=iso=>(state.settings.absences||[]).some(a=>a.from<=iso&&a.to>=iso);
const addDays=(iso,n)=>new Date(new Date(iso).getTime()+n*864e5).toISOString().slice(0,10);
function nextSessionId(prevId){
  const order=activePlan().sessions.map(x=>x.id);
  const i=order.indexOf(prevId);
  return i<0?order[0]:order[(i+1)%order.length];
}
// Plan ab dem letzten Training erzeugen (vergangene Einträge fallen weg)
function buildSchedule(force){
  const t=todayISO();
  let sc=(state.settings.schedule||[]).filter(x=>x.date>=t);
  const ls=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date));
  const lastLog=ls[ls.length-1];
  // Startpunkt: nach letztem geplanten Eintrag, sonst nach letztem Training
  if(force||!sc.length){
    let d=lastLog?addDays(lastLog.date,RHYTHM):t;
    if(d<t)d=t;
    let sid=nextSessionId(lastLog?lastLog.sessionId:null);
    sc=[];
    for(let i=0;i<12;i++){
      while(isAbsent(d))d=addDays(d,1);
      sc.push({date:d,sessionId:sid});
      d=addDays(d,RHYTHM);sid=nextSessionId(sid);
    }
  }else if(sc.length<12){
    let d=addDays(sc[sc.length-1].date,RHYTHM),sid=nextSessionId(sc[sc.length-1].sessionId);
    while(sc.length<12){while(isAbsent(d))d=addDays(d,1);sc.push({date:d,sessionId:sid});d=addDays(d,RHYTHM);sid=nextSessionId(sid)}
  }
  state.settings.schedule=sc;saveJ("settings",state.settings);
  return sc;
}
// Einheit verschieben: Folgetermine rücken nach
function moveSession(fromIso,toIso){
  const sc=buildSchedule();
  const i=sc.findIndex(x=>x.date===fromIso);
  if(i<0)return;
  let d=toIso,sid=sc[i].sessionId;
  const rest=[];
  for(let k=i;k<sc.length;k++){
    while(isAbsent(d))d=addDays(d,1);
    rest.push({date:d,sessionId:sid});
    d=addDays(d,RHYTHM);sid=nextSessionId(sid);
  }
  state.settings.schedule=[...sc.slice(0,i).filter(x=>x.date<toIso),...rest].sort((a,b)=>a.date.localeCompare(b.date));
  saveJ("settings",state.settings);
  autoPlanDeload();
  state.moveFrom=null;render();toast("Verschoben auf "+fmtD(toIso)+" — Folgetermine angepasst");
}

// Deload-Planung nach Trainingslehre: Last-basiert, nicht kalenderbasiert
const ABS_RESET_DAYS=5;      // ab dieser Pausenlänge zählt sie als vollwertige Entlastung
function recoverySignals(){
  const r=[...state.logs].filter(l=>!l.deload).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  const bad=r.filter(l=>l.checkin&&((l.checkin.befinden!=null&&l.checkin.befinden<=4)||l.checkin.gefuehl==="schwach"||l.checkin.schlaf==="schlecht")).length;
  return r.length>=3&&bad>=2?bad:0;

// Nach zurückliegender längerer Pause: Zyklus zurücksetzen (Pause = Deload)
function absenceReset(){
  const t=todayISO();let changed=false;
  (state.settings.absences||[]).forEach(a=>{
    const days=(new Date(a.to)-new Date(a.from))/864e5+1;
    if(days>=ABS_RESET_DAYS&&a.to<t&&a.to>state.settings.cycleStart){state.settings.cycleStart=a.to;changed=true}
  });
  if(changed){saveJ("settings",state.settings);return true}
  return false;
}
// Termin automatisch berechnen (außer manuell gesetzt)
function autoPlanDeload(){
  const t0=todayISO(),pd0=state.settings.plannedDeload;
  // Termin erreicht/überfällig und noch kein Deload geloggt → stehen lassen
  if(pd0&&pd0<=t0&&!state.logs.some(l=>l.deload&&l.date>=pd0))return null;
  const rest=Math.max(DELOAD_AFTER-sessionsSinceCycle(),0);
  const sc=state.settings.schedule||[];
  let d;
  if(sc.length&&rest>0&&rest<=sc.length){d=new Date(sc[rest-1].date)}      // Termin aus Trainingsplan
  else{const ls=[...state.logs].sort((a,b)=>a.date.localeCompare(b.date));
    const base=ls.length?new Date(ls[ls.length-1].date):new Date();
    d=new Date(base.getTime()+Math.max(rest,1)*RHYTHM*864e5)}   // ~jeden 2. Tag
  // Signale ziehen den Termin vor
  if(performanceDrop()||recoverySignals())d=new Date(Date.now()+2*864e5);
  // Geplante Pause vor dem Termin: lange Pause ersetzt Deload → danach voller Zyklus
  const abs=(state.settings.absences||[]).filter(a=>a.to>=todayISO()).sort((x,y)=>x.from.localeCompare(y.from));
  abs.forEach(a=>{
    const days=(new Date(a.to)-new Date(a.from))/864e5+1;
    const dIso=d.toISOString().slice(0,10);
    const vorlauf=(new Date(a.from)-d)/864e5;
    if(dIso>=a.from){
      d=days>=ABS_RESET_DAYS
        ? new Date(new Date(a.to).getTime()+DELOAD_AFTER*2*864e5)   // neuer voller Zyklus
        : new Date(d.getTime()+days*864e5);                          // nur um Pausendauer schieben
    }else if(days>=ABS_RESET_DAYS&&vorlauf<=14){                     // Pause steht kurz bevor → ersetzt Deload
      d=new Date(new Date(a.to).getTime()+DELOAD_AFTER*2*864e5);
    }
  });
  const iso=d.toISOString().slice(0,10);
  if(state.settings.plannedDeload!==iso){state.settings.plannedDeload=iso;saveJ("settings",state.settings);return iso}
  return null;
}
// Start
boot();
</script>
